name: Unzip skj-translator

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  unzip_and_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip skj-translator.zip and commit
        run: |
          ZIP=translate/skj-translator.zip
          if [ -f "$ZIP" ]; then
            echo "Found $ZIP — extracting..."
            unzip -o "$ZIP" -d translate/
            echo "Configuring git user"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            echo "Removing zip file from git and adding extracted files"
            git rm -f "$ZIP" || true
            git add translate/
            if git commit -m "Unzip translate/skj-translator.zip and remove zip"; then
              echo "Committed changes, pushing..."
              git push
            else
              echo "No changes to commit"
            fi
          else
            echo "$ZIP not found — nothing to do"
            exit 1
          fi
