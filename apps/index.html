udcbe Utw\u00f3rz plik dysku<\/button>\n      <button class=\"btn-secondary\" id=\"hdd-load-btn\">\ud83d\udcc2 Wczytaj plik dysku<\/button>\n      <div class=\"disk-info\" id=\"hdd-info\">Brak dysku<\/div>\n      <div class=\"file-name\" id=\"run-status\">Gotowy<\/div>\n    <\/div>\n  <\/div>\n\n  <div id=\"status\">&gt; Oczekiwanie na konfiguracj\u0119...<\/div>\n\n  <div id=\"screen_wrapper\">\n    <div id=\"screen_container\"><\/div>\n    <!-- Ukryty input do wywo\u0142ywania systemowej klawiatury \u2014 DENTRO screen_wrapper, dzia\u0142a w fullscreen -->\n    <input id=\"hidden-keyboard-input\" type=\"text\" autocapitalize=\"off\" autocorrect=\"off\" autocomplete=\"off\" spellcheck=\"false\">\n    <div class=\"toolbar\" id=\"toolbar\" style=\"display:none\">\n      <button id=\"ctrl-alt-del\">Ctrl+Alt+Del<\/button>\n      <button id=\"fullscreen\">Pe\u0142ny ekran<\/button>\n      <button id=\"stop-vm\">Zatrzymaj VM<\/button>\n    <\/div>\n    <!-- FAB-y DENTRO de screen_wrapper \u2014 dzi\u0119ki temu s\u0105 widoczne w fullscreen (top layer) -->\n    <button class=\"fab fab-red\"    id=\"fab-dpad\"    title=\"D-pad\">+_<\/button>\n    <button class=\"fab fab-yellow\" id=\"fab-keyboard\" title=\"Klawiatura\">\u2328<\/button>\n    <button class=\"fab fab-exit\"   id=\"fab-exit-fs\"  title=\"Wyjd\u017a z pe\u0142nego ekranu\">\u2715<\/button>\n    <div class=\"dpad-panel\" id=\"dpad-panel\">\n      <div class=\"dpad-grid\">\n        <button class=\"dpad-btn dpad-up\"    data-key=\"ArrowUp\">\u25b2<\/button>\n        <button class=\"dpad-btn dpad-left\"  data-key=\"ArrowLeft\">\u25c0<\/button>\n        <button class=\"dpad-btn dpad-enter\" data-key=\"Enter\">\u23ce<\/button>\n        <button class=\"dpad-btn dpad-right\" data-key=\"ArrowRight\">\u25b6<\/button>\n        <button class=\"dpad-btn dpad-down\"  data-key=\"ArrowDown\">\u25bc<\/button>\n      <\/div>\n      <div class=\"dpad-extras\">\n        <button class=\"dpad-extra-btn\" id=\"dpad-ctrl-alt-del\" title=\"Ctrl+Alt+Del\">\u293a<\/button>\n        <button class=\"dpad-extra-btn\" id=\"dpad-fullscreen\"   title=\"Pe\u0142ny ekran\">\u26f6<\/button>\n        <button class=\"dpad-extra-btn\" id=\"dpad-stop-vm\"      title=\"Zatrzymaj VM\">\u23f9<\/button>\n        <button class=\"dpad-close\"    id=\"dpad-close\"        title=\"Zamknij\">\u2715<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"log-panel\" id=\"log-panel\">\n    <div class=\"log-header\">\n      <span>\ud83d\udccb LOGI <span id=\"log-count\" style=\"opacity:0.6\">0<\/span><\/span>\n      <span>\n        <button id=\"log-clear\">Wyczy\u015b\u0107<\/button>\n        <button class=\"log-toggle\" id=\"log-toggle\"><\/button>\n      <\/span>\n    <\/div>\n    <div id=\"log-content\"><\/div>\n  <\/div>\n\n  <!-- ===== (FAB-y przeniesione do wn\u0119trza #screen_wrapper \u2014 widoczne w fullscreen) ===== -->\n\n  <footer>\n    SKJemu \u00a9 2026 \u00b7 Powered by <a href=\"https://github.com/copy/v86\" target=\"_blank\" rel=\"noopener\">v86<\/a> \u2014 emulator x86 w WebAssembly<br>\n    Wszystko dzia\u0142a lokalnie w przegl\u0105darce. ISO nigdy nie opuszcza Twojego komputera.\n  <\/footer>\n\n  <!-- StreamSaver.js \u2014 streaming download 10 GB bez OOM -->\n  <script src=\"https://cdn.jsdelivr.net/npm/streamsaver@2.0.3/StreamSaver.min.js\"><\/script>\n\n  <!-- v86 loader z 3 fallbackami: copy.sh -> jsDelivr -> unpkg -->\n  <script>\n    // ===== Wbudowany panel log\u00f3w (przechwytuje console.log/warn/error/info/debug) =====\n    (function () {\n      const logContent = document.getElementById('log-content');\n      const logCount  = document.getElementById('log-count');\n      const logClear  = document.getElementById('log-clear');\n      const logToggle = document.getElementById('log-toggle');\n      const logPanel  = document.getElementById('log-panel');\n      let count = 0;\n      let collapsed = false;\n\n      function fmtTime() {\n        const d = new Date();\n        return d.getHours().toString().padStart(2,'0') + ':' +\n               d.getMinutes().toString().padStart(2,'0') + ':' +\n               d.getSeconds().toString().padStart(2,'0') + '.' +\n               d.getMilliseconds().toString().padStart(3,'0');\n      }\n\n      function append(level, args) {\n        if (!logContent) return;\n        const line = document.createElement('span');\n        line.className = 'log-line log-' + level;\n        const msg = args.map(a => {\n          if (a instanceof Error) return a.stack || a.message;\n          if (typeof a === 'string') return a;\n          try { return JSON.stringify(a); } catch (_) { return String(a); }\n        }).join(' ');\n        const t = document.createElement('span');\n        t.className = 'log-time';\n        t.textContent = '[' + fmtTime() + ']';\n        line.appendChild(t);\n        line.appendChild(document.createTextNode(level.toUpperCase() + ' ' + msg + '\\n'));\n        logContent.appendChild(line);\n        // Auto-scroll na d\u00f3\u0142\n        logContent.scrollTop = logContent.scrollHeight;\n        count++;\n        if (logCount) logCount.textContent = count;\n        // Limit 500 linii\n        while (logContent.children.length > 500) {\n          logContent.removeChild(logContent.firstChild);\n        }\n      }\n\n      // Przechwy\u0107 metody konsoli\n      ['log','warn','error','info','debug'].forEach(level => {\n        const orig = console[level] ? console[level].bind(console) : () => {};\n        console[level] = function (...args) {\n          append(level === 'log' ? 'info' : level, args);\n          orig.apply(console, args);\n        };\n      });\n      // Przechwy\u0107 nieobs\u0142u\u017cone b\u0142\u0119dy\n      window.addEventListener('error', (e) => {\n        append('error', ['UNCAUGHT: ' + (e.message || '') + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : '')]);\n      });\n      window.addEventListener('unhandledrejection', (e) => {\n        const r = e.reason;\n        append('error', ['PROMISE REJECT: ' + (r && r.stack ? r.stack : (r && r.message ? r.message : String(r)))]);\n      });\n\n      if (logClear) logClear.addEventListener('click', () => {\n        logContent.innerHTML = '';\n        count = 0;\n        if (logCount) logCount.textContent = '0';\n      });\n      if (logToggle) logToggle.addEventListener('click', () => {\n        collapsed = !collapsed;\n        logPanel.classList.toggle('collapsed', collapsed);\n      });\n\n      console.log('[SKJemu] Panel log\u00f3w gotowy \u2014 wszystkie komunikaty konsoli pojawi\u0105 si\u0119 tutaj.');\n    })();\n\n    // ===== P\u0142ywaj\u0105ce przyciski (mobile D-pad + klawiatura) =====\n    (function () {\n      const fabDpad = document.getElementById('fab-dpad');\n      const fabKeyboard = document.getElementById('fab-keyboard');\n      const dpadPanel = document.getElementById('dpad-panel');\n      const dpadClose = document.getElementById('dpad-close');\n      const dpadCtrlAltDel = document.getElementById('dpad-ctrl-alt-del');\n      const dpadFullscreen = document.getElementById('dpad-fullscreen');\n      const dpadStopVm = document.getElementById('dpad-stop-vm');\n\n      // Otw\u00f3rz/zamknij D-pad\n      if (fabDpad) fabDpad.addEventListener('click', () => {\n        dpadPanel.classList.toggle('open');\n        console.log('[SKJemu] D-pad toggled:', dpadPanel.classList.contains('open'));\n      });\n      if (dpadClose) dpadClose.addEventListener('click', () => {\n        dpadPanel.classList.remove('open');\n      });\n\n      // Ctrl+Alt+Del z D-pad panelu\n      if (dpadCtrlAltDel) dpadCtrlAltDel.addEventListener('click', () => {\n        if (emulator) {\n          emulator.keyboard_send_scancodes([0x1D, 0x38, 0x53, 0xD3 | 0x80, 0xB8, 0x9D]);\n          console.log('[SKJemu] Ctrl+Alt+Del sent from D-pad');\n        }\n      });\n\n      // Fullscreen z D-pad panelu\n      if (dpadFullscreen) dpadFullscreen.addEventListener('click', () => {\n        if (document.fullscreenElement || document.webkitFullscreenElement) {\n          (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen).call(document);\n        } else {\n          const target = screenContainer.parentElement; // #screen_wrapper\n          if (target.requestFullscreen) target.requestFullscreen();\n          else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();\n          else if (target.webkitEnterFullscreen) target.webkitEnterFullscreen();\n          else if (target.mozRequestFullScreen) target.mozRequestFullScreen();\n          else if (target.msRequestFullscreen) target.msRequestFullscreen();\n        }\n      });\n\n      // Stop VM z D-pad panelu\n      if (dpadStopVm) dpadStopVm.addEventListener('click', () => {\n        if (emulator) {\n          if (emulator._skjemu_watchdog) clearInterval(emulator._skjemu_watchdog);\n          try { emulator.destroy(); } catch (_) {}\n          emulator = null;\n          screenContainer.innerHTML = '';\n          screenContainer.style.display = 'none';\n          toolbar.style.display = 'none';\n          runStatus.textContent = 'Zatrzymano';\n          setStatus('VM zatrzymana z D-pad.', 'warn');\n          dpadPanel.classList.remove('open');\n        }\n      });\n\n      // Symuluj klawisze klawiatury dla v86\n      function sendKey(key) {\n        if (!emulator) {\n          console.warn('[SKJemu] VM not running \u2014 key ignored:', key);\n          return;\n        }\n        console.log('[SKJemu] Sending key:', key);\n        const scanMap = {\n          'ArrowUp':    [0x48, 0xC8],\n          'ArrowDown':  [0x50, 0xD0],\n          'ArrowLeft':  [0x4B, 0xCB],\n          'ArrowRight': [0x4D, 0xCD],\n          'Enter':      [0x1C, 0x9C],\n        };\n        if (scanMap[key]) {\n          try {\n            emulator.keyboard_send_scancodes([scanMap[key][0]]);\n            setTimeout(() => emulator.keyboard_send_scancodes([scanMap[key][1]]), 50);\n          } catch (e) {\n            console.error('[SKJemu] scancode send failed:', e);\n          }\n        }\n      }\n\n      document.querySelectorAll('.dpad-btn').forEach(btn => {\n        const key = btn.dataset.key;\n        if (!key) return;\n        ['click', 'touchend'].forEach(evt => {\n          btn.addEventListener(evt, (e) => {\n            e.preventDefault();\n            sendKey(key);\n          });\n        });\n      });\n\n      // Systemowa klawiatura \u2014 input \u017cyje DENTRO #screen_wrapper (widoczny w fullscreen)\n      let hiddenInput = document.getElementById('hidden-keyboard-input');\n      if (!hiddenInput) {\n        hiddenInput = document.createElement('input');\n        hiddenInput.id = 'hidden-keyboard-input';\n        hiddenInput.type = 'text';\n        hiddenInput.setAttribute('autocapitalize', 'off');\n        hiddenInput.setAttribute('autocorrect', 'off');\n        hiddenInput.setAttribute('autocomplete', 'off');\n        hiddenInput.setAttribute('spellcheck', 'false');\n        document.getElementById('screen_wrapper').appendChild(hiddenInput);\n      }\n\n      hiddenInput.addEventListener('input', (e) => {\n        const val = e.target.value;\n        if (val && emulator) {\n          console.log('[SKJemu] Keyboard input:', JSON.stringify(val));\n          try { emulator.keyboard_send_text(val); } catch (err) { console.error('[SKJemu] keyboard_send_text failed:', err); }\n        }\n        e.target.value = '';\n      });\n\n      hiddenInput.addEventListener('keydown', (e) => {\n        if (e.key === 'Enter' && emulator) {\n          e.preventDefault();\n          try {\n            emulator.keyboard_send_scancodes([0x1C]);\n            setTimeout(() => emulator.keyboard_send_scancodes([0x9C]), 50);\n          } catch (_) {}\n        }\n      });\n\n      // Rozszerzona logika focusu \u2014 dzia\u0142a te\u017c w fullscreen\n      if (fabKeyboard) fabKeyboard.addEventListener('click', () => {\n        // Wymu\u015b focus z kilkoma strategiami\n        hiddenInput.style.pointerEvents = 'auto';\n        hiddenInput.classList.add('focused');\n        // Stratedia 1: bezpo\u015bredni focus\n        try { hiddenInput.focus({ preventScroll: true }); } catch (_) {}\n        // Stratedia 2: click ()\n        try { hiddenInput.click(); } catch (_) {}\n        // Stratedia 3: focus po kr\u00f3tkim op\u00f3\u017anieniu (pomaga w fullscreen)\n        setTimeout(() => {\n          try { hiddenInput.focus({ preventScroll: true }); } catch (_) {}\n          // Stratedia 4: tymczasowo uczy\u0144 input widocznym \u017ceby przegl\u0105darka pokaza\u0142a klawiatur\u0119\n          const orig = {\n            opacity: hiddenInput.style.opacity,\n            width: hiddenInput.style.width,\n            height: hiddenInput.style.height,\n            pointerEvents: hiddenInput.style.pointerEvents\n          };\n          hiddenInput.style.opacity = '1';\n          hiddenInput.style.width = '10px';\n          hiddenInput.style.height = '30px';\n          hiddenInput.style.pointerEvents = 'auto';\n          hiddenInput.focus({ preventScroll: true });\n          // Po 200ms przywr\u00f3\u0107 ukryty styl\n          setTimeout(() => {\n            hiddenInput.style.opacity = orig.opacity || '0.01';\n            hiddenInput.style.width = orig.width || '1px';\n            hiddenInput.style.height = orig.height || '1px';\n          }, 200);\n        }, 100);\n        console.log('[SKJemu] System keyboard requested (fullscreen-aware)');\n      });\n\n      // Utrzymuj focus gdy u\u017cytkownik tapnie na ekran VM\n      screenContainer.addEventListener('click', () => {\n        // Nie kradnij focusu je\u015bli D-pad lub FAB-y s\u0105 otwarte\n        if (dpadPanel.classList.contains('open')) return;\n      });\n\n      console.log('[SKJemu] Mobile FABs initialized (D-pad + keyboard).');\n    })();\n  <\/script>\n\n  <script>\n    (function () {\n      const V86_VERSION = 'v86@0.5.373';\n      const V86_CACHE = '?v=skjemu20260622';\n      const V86_SOURCES = [\n        'https://cdn.jsdelivr.net/npm/' + V86_VERSION + '/build/libv86.js' + V86_CACHE,\n        'https://unpkg.com/' + V86_VERSION + '/build/libv86.js' + V86_CACHE,\n        'https://copy.sh/v86/build/libv86.js' + V86_CACHE\n      ];\n      // ZAWSZE u\u017cywamy jsDelivr jako base dla wasm/bios \u2014 maj\u0105 pe\u0142ne CORS headers.\n      // Nie ufamy __v86BasePath ustawionemu przez loader, bo je\u015bli skrypt za\u0142adowa\u0142 si\u0119\n      // z copy.sh, wasm fetch i tak by zablokowa\u0142 CORS.\n      window.__v86BasePath = 'https://cdn.jsdelivr.net/npm/' + V86_VERSION;\n      let idx = 0;\n      function tryLoad() {\n        if (idx >= V86_SOURCES.length) {\n          window.__v86LoadError = 'Nie uda\u0142o si\u0119 za\u0142adowa\u0107 libv86.js z \u017cadnego \u017ar\u00f3d\u0142a.';\n          console.error('[SKJemu]', window.__v86LoadError);\n          window.dispatchEvent(new Event('v86-load-failed'));\n          return;\n        }\n        const s = document.createElement('script');\n        s.src = V86_SOURCES[idx];\n        s.async = false;\n        s.onload = function () {\n          if (typeof V86 !== 'undefined' || typeof V86Starter !== 'undefined') {\n            console.log('[SKJemu] libv86.js loaded from', s.src,\n              '(global:', typeof V86 !== 'undefined' ? 'V86' : 'V86Starter', ')');\n            window.dispatchEvent(new Event('v86-loaded'));\n          } else {\n            console.warn('[SKJemu] Script loaded but V86/V86Starter missing, trying next:', s.src);\n            idx++;\n            tryLoad();\n          }\n        };\n        s.onerror = function () {\n          console.warn('[SKJemu] Failed to load libv86.js from', s.src);\n          idx++;\n          tryLoad();\n        };\n        document.head.appendChild(s);\n      }\n      tryLoad();\n    })();\n  <\/script>\n  <script>\n    \"use strict\";\n\n    const isoInput     = document.getElementById('iso-input');\n    const isoBtn       = document.getElementById('iso-btn');\n    const isoName      = document.getElementById('iso-name');\n    const tinycoreBtn  = document.getElementById('tinycore-btn');\n    const ramSlider    = document.getElementById('ram-slider');\n    const ramDisplay   = document.getElementById('ram-display');\n    const runBtn       = document.getElementById('run-btn');\n    const runStatus    = document.getElementById('run-status');\n    const hddCreateBtn = document.getElementById('hdd-create-btn');\n    const hddLoadBtn   = document.getElementById('hdd-load-btn');\n    const hddInfo      = document.getElementById('hdd-info');\n    const ramCreateBtn = document.getElementById('ram-create-btn');\n    const ramLoadBtn   = document.getElementById('ram-load-btn');\n    const ramInfo      = document.getElementById('ram-info');\n    const biosBtn      = document.getElementById('bios-btn');\n    const biosLoadBtn  = document.getElementById('bios-load-btn');\n    const biosName     = document.getElementById('bios-name');\n    const statusEl     = document.getElementById('status');\n    const screenContainer = document.getElementById('screen_container');\n    const toolbar      = document.getElementById('toolbar');\n    const ctrlAltDelBtn = document.getElementById('ctrl-alt-del');\n    const fullscreenBtn = document.getElementById('fullscreen');\n    const stopBtn      = document.getElementById('stop-vm');\n\n    let isoFile = null;\n    let emulator = null;\n    let hddBlob = null;          // Blob/File dysku twardego (raw)\n    let hddHandle = null;        // FileSystemFileHandle (je\u015bli utworzony przez showSaveFilePicker)\n    let ramBlob = null;          // RAM jako Blob/File (raw) \u2014 nadpisuje suwak je\u015bli ustawiony\n    let ramHandle = null;        // FileSystemFileHandle dla RAM\n    let biosFile = null;         // Wybrany BIOS (Blob/File) \u2014 je\u015bli null, u\u017cywa domy\u015blnego z CDN\n    const TINYCORE_URL = 'http://tinycorelinux.net/17.x/x86/release/TinyCore-current.iso';\n    // TinyCore jest serwowane tylko przez HTTP. Aby unikn\u0105\u0107 mixed-content na HTTPS stronie,\n    // u\u017cywamy HTTPS proxy. Lista proxy sprawdzana po kolei.\n    const TINYCORE_PROXIES = [\n      'https://api.allorigins.win/raw?url=' + encodeURIComponent(TINYCORE_URL),\n      'https://corsproxy.io/?url=' + encodeURIComponent(TINYCORE_URL),\n      TINYCORE_URL // ostatnia opcja \u2014 bezpo\u015brednio (zadzia\u0142a tylko gdy strona jest HTTP lub file://)\n    ];\n    const HDD_SIZE = 10 * 1024 * 1024 * 1024; // 10 GB\n\n    /* ====== IndexedDB \u2014 trwa\u0142y storage dla ISO / dysku / RAM ====== */\n    const DB_NAME = 'skjemu-store';\n    const DB_VERSION = 1;\n    let db = null;\n\n    function dbOpen() {\n      return new Promise((resolve, reject) => {\n        const req = indexedDB.open(DB_NAME, DB_VERSION);\n        req.onupgradeneeded = (e) => {\n          const d = e.target.result;\n          if (!d.objectStoreNames.contains('files')) d.createObjectStore('files', { keyPath: 'key' });\n        };\n        req.onsuccess = (e) => { db = e.target.result; resolve(db); };\n        req.onerror = (e) => reject(e.target.error);\n      });\n    }\n    function dbPut(key, blob) {\n      return new Promise((resolve, reject) => {\n        const tx = db.transaction('files', 'readwrite');\n        tx.objectStore('files').put({ key, blob, size: blob.size, ts: Date.now() });\n        tx.oncomplete = () => resolve();\n        tx.onerror = () => reject(tx.error);\n      });\n    }\n    function dbGet(key) {\n      return new Promise((resolve, reject) => {\n        const tx = db.transaction('files', 'readonly');\n        const req = tx.objectStore('files').get(key);\n        req.onsuccess = () => resolve(req.result || null);\n        req.onerror = () => reject(req.error);\n      });\n    }\n    function dbDel(key) {\n      return new Promise((resolve, reject) => {\n        const tx = db.transaction('files', 'readwrite');\n        tx.objectStore('files').delete(key);\n        tx.oncomplete = () => resolve();\n        tx.onerror = () => reject(tx.error);\n      });\n    }\n\n    function setStatus(msg, type) {\n      statusEl.textContent = '> ' + msg;\n      statusEl.className = type || '';\n    }\n\n    /* ---------- 1. ISO ---------- */\n    isoBtn.addEventListener('click', () => isoInput.click());\n\n    isoInput.addEventListener('change', (e) => {\n      const f = e.target.files && e.target.files[0];\n      if (!f) return;\n      isoFile = f;\n      const sizeMB = (f.size / 1024 / 1024).toFixed(1);\n      isoName.textContent = f.name + '\\n' + sizeMB + ' MB';\n      setStatus('ISO za\u0142adowane: ' + f.name + ' (' + sizeMB + ' MB)', 'ok');\n      runStatus.textContent = 'Gotowy do startu';\n      dbPut('iso', f).catch(err => setStatus('Uwaga: nie zapisano do IndexedDB: ' + err, 'warn'));\n    });\n\n    /* ---------- 1b. Pobierz TinyCore (z proxy HTTPS fallback) ---------- */\n    tinycoreBtn.addEventListener('click', async () => {\n      if (tinycoreBtn.dataset.loading === '1') return;\n      tinycoreBtn.dataset.loading = '1';\n      tinycoreBtn.disabled = true;\n      const origText = tinycoreBtn.textContent;\n      let lastErr = null;\n      for (let i = 0; i < TINYCORE_PROXIES.length; i++) {\n        const url = TINYCORE_PROXIES[i];\n        try {\n          setStatus('Pobieranie TinyCore (' + (i + 1) + '/' + TINYCORE_PROXIES.length + ')...');\n          const resp = await fetch(url);\n          if (!resp.ok) throw new Error('HTTP ' + resp.status);\n          const blob = await resp.blob();\n          if (blob.size < 1024 * 1024) throw new Error('plik za ma\u0142y: ' + blob.size + ' B');\n          isoFile = new File([blob], 'TinyCore-17.0.iso', { type: 'application/octet-stream' });\n          const sizeMB = (isoFile.size / 1024 / 1024).toFixed(1);\n          isoName.textContent = isoFile.name + '\\n' + sizeMB + ' MB';\n          tinycoreBtn.textContent = '\u2713 Pobrano';\n          tinycoreBtn.classList.add('active');\n          setStatus('TinyCore pobrany: ' + isoFile.name + ' (' + sizeMB + ' MB)', 'ok');\n          runStatus.textContent = 'Gotowy do startu';\n          await dbPut('iso', isoFile).catch(() => {});\n          lastErr = null;\n          break;\n        } catch (err) {\n          lastErr = err;\n          console.warn('[SKJemu] TinyCore proxy ' + (i + 1) + ' failed:', err.message || err);\n        }\n      }\n      if (lastErr) {\n        setStatus('B\u0142\u0105d pobierania TinyCore z wszystkich \u017ar\u00f3de\u0142: ' + (lastErr.message || lastErr) + '. Pobierz r\u0119cznie z tinycorelinux.net i u\u017cyj \u201eWybierz ISO\u201d.', 'error');\n        tinycoreBtn.textContent = origText;\n      }\n      tinycoreBtn.disabled = false;\n      delete tinycoreBtn.dataset.loading;\n    });\n\n    /* ---------- 2d. BIOS \u2014 pobierz / wczytaj ---------- */\n\n    // Pobierz SeaBIOS z CDN (przez fallback proxy tak jak TinyCore)\n    biosBtn.addEventListener('click', async () => {\n      if (biosBtn.dataset.loading === '1') return;\n      biosBtn.dataset.loading = '1';\n      biosBtn.disabled = true;\n      const origText = biosBtn.textContent;\n      const base = 'https://cdn.jsdelivr.net/npm/v86@0.5.373';\n      const BIOS_BASE = 'https://cdn.jsdelivr.net/gh/copy/v86@master/bios';  // npm package nie ma folderu bios/\n      const urls = [\n        BIOS_BASE + '/seabios.bin',\n        'https://unpkg.com/v86@latest/bios/seabios.bin',\n        'https://copy.sh/v86/bios/seabios.bin'\n      ];\n      let lastErr = null;\n      for (let i = 0; i < urls.length; i++) {\n        try {\n          setStatus('Pobieranie SeaBIOS (' + (i + 1) + '/' + urls.length + '): ' + urls[i].substring(0, 60) + '...');\n          console.log('[SKJemu] Fetching BIOS from:', urls[i]);\n          const resp = await fetch(urls[i], { mode: 'cors' });\n          if (!resp.ok) throw new Error('HTTP ' + resp.status + ' ' + resp.statusText);\n          const blob = await resp.blob();\n          if (blob.size < 10000) throw new Error('plik za ma\u0142y: ' + blob.size + ' B');\n          biosFile = new File([blob], 'seabios.bin', { type: 'application/octet-stream' });\n          const sizeKB = (biosFile.size / 1024).toFixed(1);\n          biosName.textContent = biosFile.name + ' \\n' + sizeKB + ' KB';\n          biosBtn.textContent = '\u2713 SeaBIOS pobrany';\n          biosBtn.classList.add('active');\n          setStatus('SeaBIOS pobrany: ' + biosFile.name + ' (' + sizeKB + ' KB) z ' + (i + 1) + '. \u017ar\u00f3d\u0142a', 'ok');\n          console.log('[SKJemu] BIOS loaded from source', i + 1, urls[i]);\n          await dbPut('bios', biosFile).catch(() => {});\n          lastErr = null;\n          break;\n        } catch (err) {\n          lastErr = err;\n          console.warn('[SKJemu] BIOS source ' + (i + 1) + ' failed:', urls[i], '\u2192', err.message || err);\n        }\n      }\n      if (lastErr) {\n        setStatus('B\u0142\u0105d pobierania SeaBIOS: ' + (lastErr.message || lastErr), 'error');\n        biosBtn.textContent = origText;\n      }\n      biosBtn.disabled = false;\n      delete biosBtn.dataset.loading;\n    });\n\n    // Wczytaj w\u0142asny plik BIOS (.bin / .rom)\n    biosLoadBtn.addEventListener('click', () => {\n      const inp = document.createElement('input');\n      inp.type = 'file';\n      inp.accept = '.bin,.rom,application/octet-stream';\n      inp.onchange = (e) => {\n        const f = e.target.files && e.target.files[0];\n        if (!f) return;\n        biosFile = f;\n        const sizeKB = (f.size / 1024).toFixed(1);\n        biosName.textContent = f.name + ' \\n' + sizeKB + ' KB';\n        biosLoadBtn.textContent = '\u2713 BIOS wczytany';\n        biosLoadBtn.classList.add('active');\n        setStatus('Wczytano BIOS: ' + f.name + ' (' + sizeKB + ' KB)', 'ok');\n        dbPut('bios', f).catch(() => {});\n      };\n      inp.click();\n    });\n\n    /* ---------- 2b. Dysk twardy \u2014 utw\u00f3rz / wczytaj plik raw ---------- */\n\n    // Utw\u00f3rz plik dysku (10 GB raw) \u2014 STREAMING przez StreamSaver.js, 256 MB chunk\u00f3w\n    hddCreateBtn.addEventListener('click', async () => {\n      if (typeof streamSaver === 'undefined') {\n        setStatus('B\u0141\u0104D: StreamSaver.js nie za\u0142adowa\u0142 si\u0119. Spr\u00f3buj od\u015bwie\u017cy\u0107.', 'error');\n        return;\n      }\n      hddCreateBtn.disabled = true;\n      const origText = hddCreateBtn.textContent;\n      try {\n        setStatus('Tworzenie 10 GB pliku dysku (streaming)...', 'warn');\n        streamSaver.mitm = 'https://jimmywarting.github.io/StreamSaver.js/mitm.html?version=2.0.0';\n        const fileStream = streamSaver.createWriteStream('skjemu-disk-10gb.raw');\n        const writer = fileStream.getWriter();\n        const chunkSize = 256 * 1024 * 1024; // 256 MB\n        const chunk = new Uint8Array(chunkSize); // ten sam chunk, zero w pami\u0119ci\n        const totalChunks = Math.ceil(HDD_SIZE / chunkSize);\n        for (let i = 0; i < totalChunks; i++) {\n          const size = Math.min(chunkSize, HDD_SIZE - i * chunkSize);\n          await writer.write(chunk.subarray(0, size));\n          const writtenGB = ((i + 1) * chunkSize / 1024 / 1024 / 1024).toFixed(2);\n          setStatus('Zapisano ' + (i + 1) + '/' + totalChunks + ' (' + writtenGB + ' GB / 10 GB)...', 'warn');\n          hddCreateBtn.textContent = writtenGB + ' GB / 10 GB';\n        }\n        await writer.close();\n        setStatus('Plik dysku 10 GB pobrany (skjemu-disk-10gb.raw). Kliknij \u201eWczytaj plik dysku\u201d aby u\u017cy\u0107.', 'ok');\n        hddCreateBtn.textContent = '\u2713 Dysk pobrany';\n        hddCreateBtn.classList.add('active');\n      } catch (err) {\n        console.error('[SKJemu] Disk creation failed:', err);\n        setStatus('B\u0142\u0105d tworzenia dysku: ' + (err.message || err) + '. Spr\u00f3buj ponownie.', 'error');\n        hddCreateBtn.textContent = origText;\n      } finally {\n        hddCreateBtn.disabled = false;\n      }\n    });\n\n    // Wczytaj istniej\u0105cy plik dysku (raw) przez zwyk\u0142y file picker\n    hddLoadBtn.addEventListener('click', () => {\n      const inp = document.createElement('input');\n      inp.type = 'file';\n      inp.accept = '.raw,.img,application/octet-stream';\n      inp.onchange = (e) => {\n        const f = e.target.files && e.target.files[0];\n        if (!f) return;\n        hddBlob = f;\n        hddHandle = null;\n        hddLoadBtn.textContent = '\u2713 Dysk wczytany';\n        hddLoadBtn.classList.add('active');\n        const sizeGB = (f.size / 1024 / 1024 / 1024).toFixed(2);\n        hddInfo.textContent = 'HDD: ' + sizeGB + ' GB \u00b7 ' + f.name;\n        hddInfo.classList.add('has-disk');\n        setStatus('Wczytano plik dysku: ' + f.name + ' (' + sizeGB + ' GB)', 'ok');\n      };\n      inp.click();\n    });\n\n    /* ---------- 2c. RAM \u2014 utw\u00f3rz / wczytaj plik raw ---------- */\n\n    ramSlider.addEventListener('input', (e) => {\n      const v = parseInt(e.target.value, 10);\n      ramDisplay.textContent = v;\n      if (ramBlob) {\n        // Je\u015bli mamy wczytany plik RAM, zmiana suwaka go odrzuca\n        ramBlob = null;\n        ramHandle = null;\n        ramLoadBtn.textContent = '\ud83d\udcc2 Wczytaj plik RAM';\n        ramLoadBtn.classList.remove('active');\n        ramCreateBtn.textContent = '\ud83d\udcc4 Utw\u00f3rz plik RAM';\n        ramCreateBtn.classList.remove('active');\n      }\n      ramInfo.textContent = 'RAM z suwaka (' + v + ' GB)';\n      ramInfo.classList.remove('has-disk');\n      if (v > 4) {\n        setStatus('Uwaga: powy\u017cej 4 GB mo\u017ce nie zadzia\u0142a\u0107 we wszystkich przegl\u0105darkach (limit pami\u0119ci liniowej WebAssembly).', 'warn');\n      }\n    });\n\n    // Utw\u00f3rz plik RAM \u2014 ZAWSZE STREAMING przez StreamSaver.js (dzia\u0142a dla >2 GB)\n    ramCreateBtn.addEventListener('click', async () => {\n      if (typeof streamSaver === 'undefined') {\n        setStatus('B\u0141\u0104D: StreamSaver.js nie za\u0142adowa\u0142 si\u0119. Spr\u00f3buj od\u015bwie\u017cy\u0107.', 'error');\n        return;\n      }\n      const ramGB = parseInt(ramSlider.value, 10);\n      let ramSize = ramGB * 1024 * 1024 * 1024;\n      if (ramSize > 3.5 * 1024 * 1024 * 1024) {\n        ramSize = 3.5 * 1024 * 1024 * 1024;\n        setStatus('Ostrze\u017cenie: ' + ramGB + ' GB przekracza limit WASM \u2014 plik RAM b\u0119dzie 3.5 GB.', 'warn');\n      }\n      ramCreateBtn.disabled = true;\n      const origText = ramCreateBtn.textContent;\n      try {\n        streamSaver.mitm = 'https://jimmywarting.github.io/StreamSaver.js/mitm.html?version=2.0.0';\n        const fileStream = streamSaver.createWriteStream('skjemu-ram-' + ramGB + 'gb.raw');\n        const writer = fileStream.getWriter();\n        const chunkSize = 256 * 1024 * 1024;\n        const chunk = new Uint8Array(chunkSize);\n        const totalChunks = Math.ceil(ramSize / chunkSize);\n        for (let i = 0; i < totalChunks; i++) {\n          const size = Math.min(chunkSize, ramSize - i * chunkSize);\n          await writer.write(chunk.subarray(0, size));\n          const writtenGB = ((i + 1) * chunkSize / 1024 / 1024 / 1024).toFixed(2);\n          setStatus('Zapisano ' + (i + 1) + '/' + totalChunks + ' (' + writtenGB + ' GB / ' + ramGB + ' GB)...', 'warn');\n          ramCreateBtn.textContent = writtenGB + ' GB / ' + ramGB + ' GB';\n        }\n        await writer.close();\n        setStatus('Plik RAM ' + ramGB + ' GB pobrany. Kliknij \u201eWczytaj plik RAM\u201d aby u\u017cy\u0107.', 'ok');\n        ramCreateBtn.textContent = '\u2713 RAM pobrany';\n        ramCreateBtn.classList.add('active');\n      } catch (err) {\n        console.error('[SKJemu] RAM creation failed:', err);\n        setStatus('B\u0142\u0105d tworzenia RAM: ' + (err.message || err) + '.', 'error');\n        ramCreateBtn.textContent = origText;\n      } finally {\n        ramCreateBtn.disabled = false;\n      }\n    });\n\n    // Wczytaj istniej\u0105cy plik RAM (raw)\n    ramLoadBtn.addEventListener('click', () => {\n      const inp = document.createElement('input');\n      inp.type = 'file';\n      inp.accept = '.raw,.img,application/octet-stream';\n      inp.onchange = (e) => {\n        const f = e.target.files && e.target.files[0];\n        if (!f) return;\n        ramBlob = f;\n        ramHandle = null;\n        ramLoadBtn.textContent = '\u2713 RAM wczytany';\n        ramLoadBtn.classList.add('active');\n        const sizeGB = (f.size / 1024 / 1024 / 1024).toFixed(2);\n        ramInfo.textContent = 'RAM: ' + sizeGB + ' GB \u00b7 ' + f.name;\n        ramInfo.classList.add('has-disk');\n        setStatus('Wczytano plik RAM: ' + f.name + ' (' + sizeGB + ' GB)', 'ok');\n      };\n      inp.click();\n    });\n\n    /* ---------- 3. RUN VM ---------- */\n    runBtn.addEventListener('click', async () => {\n      if (!isoFile) {\n        setStatus('B\u0141\u0104D: najpierw wybierz plik ISO', 'error');\n        isoBtn.focus();\n        return;\n      }\n      const V86Ctor = typeof V86 !== 'undefined' ? V86 : (typeof V86Starter !== 'undefined' ? V86Starter : null);\n      if (!V86Ctor) {\n        setStatus('B\u0141\u0104D: biblioteka v86 (libv86.js) nie za\u0142adowa\u0142a si\u0119 z \u017cadnego \u017ar\u00f3d\u0142a (copy.sh, jsDelivr, unpkg). Sprawd\u017a po\u0142\u0105czenie, wy\u0142\u0105cz adblock lub spr\u00f3buj inn\u0105 sie\u0107.', 'error');\n        return;\n      }\n\n      // Reset poprzedniej instancji\n      if (emulator) {\n        try { emulator.destroy(); } catch (_) {}\n        emulator = null;\n        screenContainer.innerHTML = '';\n      }\n\n      const ramGB = parseInt(ramSlider.value, 10);\n      let memorySize;\n      if (ramBlob) {\n        // Je\u015bli wczytano plik RAM, u\u017cyj jego rozmiaru (z limitem 3.5 GB)\n        memorySize = ramBlob.size;\n        if (memorySize > 3.5 * 1024 * 1024 * 1024) {\n          memorySize = 3.5 * 1024 * 1024 * 1024;\n          setStatus('Ostrze\u017cenie: plik RAM przekracza limit WASM \u2014 u\u017cywam 3.5 GB. Inicjalizacja VM...', 'warn');\n        } else {\n          setStatus('Inicjalizacja VM z pliku RAM (' + (memorySize / 1024 / 1024 / 1024).toFixed(1) + ' GB)...');\n        }\n      } else {\n        memorySize = ramGB * 1024 * 1024 * 1024;\n        if (memorySize > 3.5 * 1024 * 1024 * 1024) {\n          memorySize = 3.5 * 1024 * 1024 * 1024;\n          setStatus('Ostrze\u017cenie: ' + ramGB + ' GB przekracza limit WASM \u2014 u\u017cywam 3.5 GB. Inicjalizacja VM...', 'warn');\n        } else {\n          setStatus('Inicjalizacja VM (' + ramGB + ' GB RAM)...');\n        }\n      }\n\n      // Zapisz / zaktualizuj symulowany RAM w IndexedDB (opcjonalne, dla trwa\u0142o\u015bci)\n      try {\n        const ramBuf = new ArrayBuffer(Math.min(memorySize, 256 * 1024 * 1024)); // max 256 MB do IndexedDB\n        const ramBlobDbg = new Blob([ramBuf], { type: 'application/octet-stream' });\n        await dbPut('ram', ramBlobDbg);\n        console.log('[SKJemu] RAM snapshot saved to IndexedDB:', ramBlobDbg.size, 'bytes');\n      } catch (e) {\n        console.warn('[SKJemu] RAM save to IndexedDB failed:', e);\n      }\n\n      runBtn.disabled = true;\n      runStatus.textContent = 'Uruchamianie...';\n      screenContainer.style.display = 'block';\n      toolbar.style.display = 'flex';\n\n      try {\n        const base = 'https://cdn.jsdelivr.net/npm/v86@0.5.373';\n        const BIOS_BASE = 'https://cdn.jsdelivr.net/gh/copy/v86@master/bios';\n        const optNetwork = document.getElementById('opt-network').checked;\n        const optAutoscale = document.getElementById('opt-autoscale').checked;\n        const opts = {\n          wasm_path:        base + '/build/v86.wasm',\n          memory_size:      memorySize,\n          vga_memory_size:  8 * 1024 * 1024,\n          container:        screenContainer,\n          bios:             biosFile ? { buffer: biosFile } : { url: BIOS_BASE + '/seabios.bin' },\n          vga_bios:         { url: BIOS_BASE + '/vgabios.bin' },\n          cdrom:            { buffer: isoFile },\n          boot_order:       0x123,\n          fastboot:         true,\n          autostart:        true,\n          screen:           { container: screenContainer, use_graphical_text: false },\n        };\n        if (optNetwork) {\n          opts.network_relay_url = 'wss://relay.widgetry.org/';\n          console.log('[SKJemu] Network enabled (relay: wss://relay.widgetry.org/)');\n        }\n        if (hddBlob) {\n          opts.hda = { buffer: hddBlob };\n        }\n        // Skalowanie obrazu\n        screenContainer.classList.toggle('auto-scale', optAutoscale);\n        console.log('[SKJemu] Auto-scale:', optAutoscale, '| Network:', optNetwork);\n        console.log('[SKJemu] Starting VM with options:', {\n          wasm_path: opts.wasm_path,\n          memory_size: opts.memory_size,\n          container: !!opts.container,\n          bios: opts.bios.url || ('[buffer ' + (opts.bios.buffer?.size || 0) + ' B]'),\n          vga_bios: opts.vga_bios.url,\n          cdrom: '[buffer ' + (opts.cdrom.buffer?.size || 0) + ' B]',\n          hda: opts.hda ? '[buffer ' + (opts.hda.buffer?.size || 0) + ' B]' : false,\n          ctor: V86Ctor.name || 'V86'\n        });\n        emulator = new V86Ctor(opts);\n\n        // ===== Diagnoza \u2014 loguj KA\u017bDY event v86 =====\n        const v86Events = ['emulator-ready','emulator-started','emulator-loaded','emulator-error','emulator-stopped','emulator-paused','download-progress','download-error','serial0-output-byte','serial0-input-byte','serial1-output-byte','serial2-output-byte','serial3-output-byte','ide-read-start','ide-read-end','ide-write-end','net0-send','net0-receive','cpu-event-halt','cpu-event-math','screen-graphics-mode','screen-text-mode','screen-set-size','screen-typed-text','vga-palette','vga-text-mode','mouse-toggle','keyboard-input'];\n        v86Events.forEach(ev => {\n          try {\n            emulator.add_listener(ev, (...args) => {\n              if (ev === 'serial0-output-byte') {\n                const chr = args[0];\n                const text = (typeof chr === 'number') ? String.fromCharCode(chr) : String(chr);\n                if (text && /[\\x20-\\x7E\\n\\r\\t]/.test(text)) {\n                  console.log('[v86 serial] ' + JSON.stringify(text));\n                }\n              } else if (ev === 'download-progress') {\n                const a = args[0] || {};\n                console.log('[v86 download] ' + (a.file_name || '?') + ' ' + (a.loaded||0) + '/' + (a.total||0) + ' B');\n              } else if (ev === 'download-error') {\n                console.error('[v86 download-error]', args[0]);\n              } else if (ev === 'screen-graphics-mode' || ev === 'screen-text-mode' || ev === 'screen-set-size') {\n                console.log('[v86 ' + ev + ']', args.length ? args[0] : '');\n              } else {\n                console.log('[v86 ' + ev + ']', args.length ? args[0] : '');\n              }\n            });\n          } catch (e) {}\n        });\n\n        // Dodatkowo: przechwy\u0107 KA\u017bDY event z busa v86 (wildcard)\n        try {\n          const origSend = emulator.bus.send.bind(emulator.bus);\n          emulator.bus.send = function(name, ...args) {\n            if (!['screen-put-pixel','screen-put-char','screen-update-cursor','serial0-output-byte','download-progress','cpu-event-halt','ide-read-start','ide-read-end'].includes(name)) {\n              console.log('[v86 bus] ' + name + (args.length ? ' ' + JSON.stringify(args).substring(0, 200) : ''));\n            }\n            return origSend(name, ...args);\n          };\n        } catch (e) { console.warn('[SKJemu] Could not hook bus.send:', e); }\n\n        let bootStart = Date.now();\n        let lastActivity = Date.now();\n        let emulatorLoaded = false;\n        let emulatorReady = false;\n\n        emulator.add_listener('emulator-loaded', () => {\n          emulatorLoaded = true;\n          lastActivity = Date.now();\n          const elapsed = ((Date.now() - bootStart) / 1000).toFixed(1);\n          console.log('[SKJemu] emulator-loaded after ' + elapsed + 's. CPU should start now.');\n          setStatus('VM za\u0142adowana po ' + elapsed + 's \u2014 bootowanie CPU...', 'ok');\n        });\n\n        emulator.add_listener('emulator-ready', () => {\n          emulatorReady = true;\n          const elapsed = ((Date.now() - bootStart) / 1000).toFixed(1);\n          setStatus('VM gotowa po ' + elapsed + 's \u00b7 ' + ramGB + ' GB RAM \u00b7 ' + isoFile.name, 'ok');\n          runStatus.textContent = 'Dzia\u0142a \u2713';\n          runBtn.disabled = false;\n          console.log('[SKJemu] VM ready after ' + elapsed + 's');\n        });\n\n        emulator.add_listener('emulator-started', () => {\n          lastActivity = Date.now();\n          console.log('[SKJemu] Boot sequence started');\n          setStatus('Bootowanie... (wyj\u015bcie serial w logach)', 'ok');\n        });\n\n        emulator.add_listener('emulator-error', (err) => {\n          console.error('[SKJemu] VM error:', err);\n          setStatus('B\u0142\u0105d emulatora: ' + (err && err.message ? err.message : JSON.stringify(err)), 'error');\n          runBtn.disabled = false;\n          runStatus.textContent = 'B\u0142\u0105d';\n        });\n\n        // Watchdog co 5s \u2014 szczeg\u00f3\u0142owy raport\n        const watchdog = setInterval(() => {\n          if (!emulator) { clearInterval(watchdog); return; }\n          const elapsed = ((Date.now() - bootStart) / 1000).toFixed(0);\n          console.log('[SKJemu] T+' + elapsed + 's | loaded=' + emulatorLoaded + ' ready=' + emulatorReady + ' running=' + (emulator.cpu_is_running || false));\n          // Je\u015bli po 30s emulator-loaded si\u0119 nie odpali\u0142, spr\u00f3buj r\u0119cznie uruchomi\u0107\n          if (parseInt(elapsed) === 30 && !emulatorLoaded) {\n            console.warn('[SKJemu] VM not loaded after 30s. Trying manual run()...');\n            try {\n              emulator.run();\n              console.log('[SKJemu] Manual run() called.');\n            } catch (e) {\n              console.error('[SKJemu] Manual run() failed:', e);\n            }\n          }\n          if (parseInt(elapsed) > 20) {\n            setStatus('VM T+' + elapsed + 's | loaded=' + emulatorLoaded + ' ready=' + emulatorReady + '. Sprawd\u017a logi \u2014 mo\u017ce BIOS/CDROM si\u0119 \u0142aduje.', 'warn');\n          }\n        }, 5000);\n\n        emulator._skjemu_watchdog = watchdog;\n      } catch (err) {\n        setStatus('Nie uda\u0142o si\u0119 uruchomi\u0107 VM: ' + (err && err.message ? err.message : err), 'error');\n        console.error('[SKJemu] VM start failed:', err);\n        runBtn.disabled = false;\n        runStatus.textContent = 'B\u0142\u0105d';\n      }\n    });\n\n    /* ---------- Inicjalizacja \u2014 wczytaj zapisane pliki z IndexedDB ---------- */\n    (async () => {\n      try {\n        await dbOpen();\n        const savedIso = await dbGet('iso');\n        if (savedIso && savedIso.blob) {\n          isoFile = new File([savedIso.blob], 'saved-iso.iso', { type: 'application/octet-stream' });\n          const sizeMB = (isoFile.size / 1024 / 1024).toFixed(1);\n          isoName.textContent = '(z IndexedDB)\\n' + sizeMB + ' MB';\n          setStatus('Wczytano ISO z IndexedDB (' + sizeMB + ' MB). Mo\u017cesz uruchomi\u0107 VM.', 'ok');\n          runStatus.textContent = 'Gotowy do startu';\n        }\n        const savedHdd = await dbGet('hdd');\n        if (savedHdd && savedHdd.blob) {\n          hddBlob = savedHdd.blob;\n          hddLoadBtn.textContent = '\u2713 Dysk wczytany (z IndexedDB)';\n          hddLoadBtn.classList.add('active');\n          hddInfo.textContent = 'HDD: ' + (savedHdd.blob.size / 1024 / 1024 / 1024).toFixed(1) + ' GB \u00b7 z IndexedDB';\n          hddInfo.classList.add('has-disk');\n        }\n        const savedRam = await dbGet('ram');\n        if (savedRam && savedRam.blob) {\n          const ramMB = (savedRam.blob.size / 1024 / 1024).toFixed(0);\n          console.log('[SKJemu] Saved RAM found in IndexedDB:', ramMB, 'MB (will be recreated on VM start)');\n        }\n        const savedBios = await dbGet('bios');\n        if (savedBios && savedBios.blob) {\n          biosFile = new File([savedBios.blob], 'seabios.bin', { type: 'application/octet-stream' });\n          const sizeKB = (biosFile.size / 1024).toFixed(1);\n          biosName.textContent = biosFile.name + ' \\n' + sizeKB + ' KB (z IndexedDB)';\n          biosBtn.textContent = '\u2713 SeaBIOS (z pami\u0119ci)';\n          biosBtn.classList.add('active');\n        }\n      } catch (err) {\n        console.warn('IndexedDB init failed:', err);\n      }\n    })();\n\n    /* ---------- Toolbar ---------- */\n    ctrlAltDelBtn.addEventListener('click', () => {\n      if (emulator) {\n        emulator.keyboard_send_scancodes([0x1D, 0x38, 0x53, 0xD3 | 0x80, 0xB8, 0x9D]);\n        setStatus('Wys\u0142ano Ctrl+Alt+Del', 'ok');\n      }\n    });\n\n    fullscreenBtn.addEventListener('click', () => {\n      if (document.fullscreenElement || document.webkitFullscreenElement) {\n        (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen).call(document);\n      } else {\n        const target = screenContainer.parentElement; // #screen_wrapper \u2014 zawiera FAB-y\n        if (target.requestFullscreen) target.requestFullscreen();\n        else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();\n        else if (target.webkitEnterFullscreen) target.webkitEnterFullscreen();\n        else if (target.mozRequestFullScreen) target.mozRequestFullScreen();\n        else if (target.msRequestFullscreen) target.msRequestFullscreen();\n      }\n    });\n\n    // Reaguj na zmiany fullscreen \u2014 ustawiaj klas\u0119 na body\n    function onFsChange() {\n      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);\n      document.body.classList.toggle('fullscreen-mode', isFs);\n      console.log('[SKJemu] Fullscreen mode:', isFs);\n    }\n    document.addEventListener('fullscreenchange', onFsChange);\n    document.addEventListener('webkitfullscreenchange', onFsChange);\n    document.addEventListener('mozfullscreenchange', onFsChange);\n    document.addEventListener('MSFullscreenChange', onFsChange);\n\n    const fabExitFs = document.getElementById('fab-exit-fs');\n    if (fabExitFs) fabExitFs.addEventListener('click', () => {\n      if (document.fullscreenElement) document.exitFullscreen();\n      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();\n      else if (document.mozCancelFullScreen) document.mozCancelFullScreen();\n      else if (document.msExitFullscreen) document.msExitFullscreen();\n    });\n\n    stopBtn.addEventListener('click', () => {\n      if (emulator) {\n        if (emulator._skjemu_watchdog) clearInterval(emulator._skjemu_watchdog);\n        try { emulator.destroy(); } catch (_) {}\n        emulator = null;\n        screenContainer.innerHTML = '';\n        screenContainer.style.display = 'none';\n        toolbar.style.display = 'none';\n        runStatus.textContent = 'Zatrzymano';\n        setStatus('VM zatrzymana.', 'warn');\n      }\n    });\n  <\/script>\n<\/body>\n<\/html>\n"}</script>

<script>
(function () {
  var payload = JSON.parse(document.getElementById('apps-payload').textContent);
  var APP_LABELS = {
    qwen: "Qwen · WASM Chat",
    dash: "SKJ Dash",
    tube: "SKJtube",
    emu:  "SKJemu"
  };

  var menuScreen = document.getElementById('menu-screen');
  var frame = document.getElementById('app-frame');
  var backBar = document.getElementById('back-bar');
  var backBtn = document.getElementById('back-btn');
  var currentName = document.getElementById('current-name');

  function showMenu() {
    document.body.classList.add('no-bar');
    document.body.classList.remove('app-mode');
    frame.classList.remove('active');
    backBar.classList.remove('active');
    frame.srcdoc = '';
    frame.removeAttribute('srcdoc');
    menuScreen.hidden = false;
  }

  function showApp(name) {
    var html = payload[name];
    if (!html) return;
    menuScreen.hidden = true;
    document.body.classList.remove('no-bar');
    document.body.classList.add('app-mode');
    currentName.textContent = APP_LABELS[name] || name;
    backBar.classList.add('active');
    frame.classList.add('active');
    frame.srcdoc = html;
  }

  // Wire up menu cards
  document.querySelectorAll('.app-card').forEach(function (card) {
    card.addEventListener('click', function () {
      showApp(card.getAttribute('data-app'));
    });
  });

  backBtn.addEventListener('click', showMenu);

  // Optional: hardware back button on Android
  window.addEventListener('popstate', function (e) {
    if (frame.classList.contains('active')) {
      showMenu();
      history.pushState(null, '', location.href);
    }
  });
  if (history.state === null) history.replaceState({menu: true}, '');
  history.pushState({menu: true}, '');
})();
</script>
