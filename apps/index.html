<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Jasio Apps</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0a0a0a; color: #e8e8e8;
  }

  /* ===== Menu (ekran startowy) ===== */
  #menu-screen {
    height: 100%;
    display: flex; flex-direction: column;
    padding: 24px 20px; padding-top: max(24px, env(safe-area-inset-top));
    overflow-y: auto;
  }
  #menu-screen[hidden] { display: none; }

  .menu-title {
    margin: 8px 0 4px;
    font-size: 28px; font-weight: 800; text-align: center;
    background: linear-gradient(135deg, #6ea8fe, #c084fc);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .menu-sub {
    text-align: center; color: #888; font-size: 14px;
    margin: 0 0 24px;
  }

  .menu-list { max-width: 520px; margin: 0 auto; width: 100%; }

  .app-card {
    display: flex; align-items: center; gap: 14px;
    width: 100%;
    margin-bottom: 12px; padding: 16px;
    background: #161616;
    border: 1px solid #262626;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
    color: inherit;
    font: inherit;
  }
  .app-card:hover, .app-card:focus {
    background: #1f1f1f;
    border-color: #3a3a3a;
    transform: translateY(-1px);
  }
  .app-card:active { transform: translateY(0); }
  .app-card .icon {
    flex-shrink: 0;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    font-size: 22px;
  }
  .app-card .meta { flex: 1; min-width: 0; }
  .app-card .name { font-weight: 600; font-size: 16px; }
  .app-card .desc { color: #888; font-size: 13px; margin-top: 2px; }

  /* ===== Iframe view ===== */
  #app-frame {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    border: 0;
    display: none;
    background: #0a0a0a;
  }
  #app-frame.active { display: block; }

  #back-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: none;
    align-items: center;
    gap: 6px;
    padding: max(4px, env(safe-area-inset-top)) 10px 4px;
    background: rgba(10,10,10,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #262626;
  }
  #back-bar.active { display: flex; }

  #back-btn {
    appearance: none;
    background: #1f1f1f;
    color: #e8e8e8;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 4px 10px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  #back-btn:active { background: #2a2a2a; }

  #back-bar .current-name {
    font-size: 12px;
    color: #aaa;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* When an app is active, push iframe below the back bar (half-height: 24px) */
  body.app-mode #app-frame {
    top: 24px;
    height: calc(100vh - 24px);
  }
  body.no-bar #app-frame {
    top: 0;
    height: 100vh;
  }
</style>
</head>

 \u00b7 1.7B<\/span>\n        <span class=\"size\">~827 MB<\/span>\n      <\/div>\n      <div class=\"desc\">Wi\u0119kszy Qwen3. Lepszy reasoning i d\u0142u\u017csze odpowiedzi.<\/div>\n      <span class=\"badge\">Q3_K_S<\/span>\n    <\/button>\n\n    <button class=\"model-card\" data-model=\"llama32-3b\">\n      <div class=\"top\">\n        <span class=\"name\">Llama 3.2 \u00b7 3B<\/span>\n        <span class=\"size\">~998 MB<\/span>\n      <\/div>\n      <div class=\"desc\">Wi\u0119ksza Llama od Meta. Najlepsza jako\u015b\u0107, wci\u0105\u017c mie\u015bci si\u0119 w 1 GB RAM.<\/div>\n      <span class=\"badge\">IQ2_XXS (agresywna)<\/span>\n    <\/button>\n\n    <button class=\"model-card\" data-model=\"gemma4-e2b\">\n      <div class=\"top\">\n        <span class=\"name\">Gemma 4 \u00b7 E2B<\/span>\n        <span class=\"size\">~2.18 GB<\/span>\n      <\/div>\n      <div class=\"desc\">Model od Google. \u26a0\ufe0f Du\u017cy \u2014 wymaga mmap i mo\u017ce by\u0107 wolny na telefonie.<\/div>\n      <span class=\"badge\">IQ2_M (agresywna)<\/span>\n    <\/button>\n\n    <button class=\"model-card\" data-model=\"qwen25-15b\">\n      <div class=\"top\">\n        <span class=\"name\">Qwen2.5 \u00b7 1.5B<\/span>\n        <span class=\"size\">~986 MB<\/span>\n      <\/div>\n      <div class=\"desc\">Najlepsza jako\u015b\u0107 z ca\u0142ej si\u00f3demki.<\/div>\n      <span class=\"badge\">Q4_K_M<\/span>\n    <\/button>\n\n    <div class=\"menu-actions\">\n      <button class=\"action-btn danger\" id=\"manage-files-btn\">\ud83d\uddd1\ufe0f Usu\u0144 pliki<\/button>\n    <\/div>\n\n    <div class=\"menu-footer\">\n      \u26a0\ufe0f Ca\u0142a rozmowa dzieje si\u0119 lokalnie na Twoim urz\u0105dzeniu \u2014 nic nie leci do serwera.<br/>\n      Pobieranie najlepiej zrobi\u0107 przez Wi-Fi.\n    <\/div>\n  <\/div>\n\n  <!-- ===== Delete files screen ===== -->\n  <div id=\"delete-screen\">\n    <h1 class=\"delete-title\">Usu\u0144 pliki<\/h1>\n    <p class=\"delete-sub\">Zarz\u0105dzaj pobranymi modelami w pami\u0119ci przegl\u0105darki<\/p>\n    <div id=\"delete-list\"><\/div>\n    <div class=\"delete-actions\">\n      <button class=\"action-btn danger\" id=\"delete-all-btn\">Usu\u0144 wszystko<\/button>\n      <button class=\"action-btn\" id=\"delete-back-btn\">\u2190 Wr\u00f3\u0107<\/button>\n    <\/div>\n  <\/div>\n\n  <!-- ===== Loading screen ===== -->\n  <div id=\"loading-screen\">\n    <h1 id=\"loading-title\">Qwen<\/h1>\n    <div class=\"sub\">Chat lokalnie w przegl\u0105darce przez WASM<\/div>\n    <div id=\"progress-container\">\n      <div id=\"progress-bar\"><\/div>\n    <\/div>\n    <div id=\"progress-text\">Inicjalizacja\u2026<\/div>\n    <div id=\"error-box\"><\/div>\n    <button id=\"pause-btn\" style=\"display:none\">\u23f8\ufe0f Pauza<\/button>\n    <button id=\"back-btn\">\u2190 Wr\u00f3\u0107 do menu<\/button>\n  <\/div>\n\n  <!-- ===== Chat screen ===== -->\n  <div id=\"chat-screen\" hidden>\n    <header>\n      <h1>\n        <span id=\"header-title\">Qwen<\/span>\n        <span class=\"model-tag\" id=\"header-model\"><\/span>\n      <\/h1>\n      <span id=\"status-dot\"><\/span>\n      <button id=\"change-model-btn\">Menu<\/button>\n    <\/header>\n    <div id=\"messages\"><\/div>\n    <div id=\"input-bar\">\n      <textarea id=\"prompt\" placeholder=\"Napisz wiadomo\u015b\u0107\u2026\" rows=\"1\"><\/textarea>\n      <button id=\"send-btn\" disabled aria-label=\"Wy\u015blij\">\n        <svg id=\"send-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" width=\"20\" height=\"20\">\n          <line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"/>\n          <polyline points=\"12 5 19 12 12 19\"/>\n        <\/svg>\n        <svg id=\"stop-icon\" viewBox=\"0 0 24 24\" fill=\"currentColor\" width=\"14\" height=\"14\" style=\"display:none\">\n          <rect x=\"6\" y=\"6\" width=\"12\" height=\"12\" rx=\"1\"/>\n        <\/svg>\n      <\/button>\n    <\/div>\n  <\/div>\n\n  <script type=\"module\">\n    // === Konfiguracja \u017ar\u00f3de\u0142 ===\n    // wllama v3.5.1 \u2014 wspiera Qwen3.5, streaming, nowsze API (OAI-compatible)\n    const WLLAMA_CDN = 'https://cdn.jsdelivr.net/npm/@wllama/wllama@3.5.1/esm/';\n    const WLLAMA_IMPORT = WLLAMA_CDN + 'index.js';\n    const ASSETS_PATH = {\n      // W v3 wasm jest w /esm/wasm/wllama.wasm\n      'default': WLLAMA_CDN + 'wasm/wllama.wasm',\n    };\n\n    // === Modele ===\n    const MODELS = {\n      'qwen25-05b': {\n        name: 'Qwen2.5 \u00b7 0.5B',\n        // Q8_0 \u2014 prawie nieskompresowany (8-bit)\n        url: 'https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q8_0.gguf',\n        sizeMb: 506,\n        nCtx: 1024,\n        modelLoadParams: {\n          flash_attn: true,\n          n_batch: 256,\n        },\n        greeting: 'Hej! Jestem Qwen2.5 0.5B uruchomionym lokalnie w Twojej przegl\u0105darce przez WASM. O czym pogadamy?',\n      },\n      'qwen3-06b': {\n        name: 'Qwen3 \u00b7 0.6B',\n        // Q8_0 \u2014 prawie nieskompresowany (8-bit)\n        url: 'https://huggingface.co/unsloth/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf',\n        sizeMb: 609,\n        nCtx: 1024,\n        modelLoadParams: {\n          reasoning: false,\n          reasoning_format: 'none',\n          default_template_kwargs: { enable_thinking: false },\n          flash_attn: true,\n          n_batch: 256,\n        },\n        chatParams: {\n          chat_template_kwargs: { enable_thinking: false },\n        },\n        greeting: 'Cze\u015b\u0107! Jestem Qwen3 0.6B, dzia\u0142a\u0142em lokalnie przez WASM. O czym pogadamy?',\n      },\n      'qwen35-08b': {\n        name: 'Qwen3.5 \u00b7 0.8B',\n        // Q8_0 \u2014 prawie nieskompresowany (8-bit)\n        url: 'https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q8_0.gguf',\n        sizeMb: 774,\n        nCtx: 1024,\n        modelLoadParams: {\n          reasoning: false,\n          reasoning_format: 'none',\n          default_template_kwargs: { enable_thinking: false },\n          flash_attn: true,\n          n_batch: 256,\n        },\n        chatParams: {\n          chat_template_kwargs: { enable_thinking: false },\n        },\n        greeting: 'Cze\u015b\u0107! Jestem Qwen3.5 0.8B, najnowsz\u0105 generacj\u0105. Dzia\u0142am w pe\u0142ni lokalnie przez WASM. O czym pogadamy?',\n      },\n      'llama32-1b': {\n        name: 'Llama 3.2 \u00b7 1B',\n        // Q3_K_S ~611 MB \u2014 troszeczk\u0119 bardziej agresywna ni\u017c Q8_0 (by\u0142o 1.26 GB)\n        url: 'https://huggingface.co/unsloth/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q3_K_S.gguf',\n        sizeMb: 611,\n        nCtx: 1024,\n        modelLoadParams: {\n          flash_attn: true,\n          n_batch: 256,\n        },\n        greeting: 'Hej! Jestem Llama 3.2 1B od Meta, uruchomiony lokalnie w Twojej przegl\u0105darce. O czym pogadamy?',\n      },\n      'qwen3-17b': {\n        name: 'Qwen3 \u00b7 1.7B',\n        // Q3_K_S ~827 MB \u2014 troszeczk\u0119 bardziej agresywna ni\u017c Q4_K_M (by\u0142o 1.06 GB)\n        url: 'https://huggingface.co/unsloth/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q3_K_S.gguf',\n        sizeMb: 827,\n        nCtx: 1024,\n        modelLoadParams: {\n          reasoning: false,\n          reasoning_format: 'none',\n          default_template_kwargs: { enable_thinking: false },\n          flash_attn: true,\n          n_batch: 256,\n        },\n        chatParams: {\n          chat_template_kwargs: { enable_thinking: false },\n        },\n        greeting: 'Cze\u015b\u0107! Jestem Qwen3 1.7B \u2014 najwi\u0119kszy model Qwen3 tutaj. Dzia\u0142am lokalnie przez WASM. O czym rozmawiamy?',\n      },\n      'llama32-3b': {\n        name: 'Llama 3.2 \u00b7 3B',\n        // UD-IQ2_XXS ~998 MB \u2014 agresywna kwantyzacja (1.8 bpw) \u017ceby zmie\u015bci\u0107 si\u0119 w 1 GB RAM\n        url: 'https://huggingface.co/unsloth/Llama-3.2-3B-Instruct-GGUF/resolve/main/Llama-3.2-3B-Instruct-UD-IQ2_XXS.gguf',\n        sizeMb: 998,\n        nCtx: 512,\n        modelLoadParams: {\n          flash_attn: true,\n          n_batch: 128,\n        },\n        greeting: 'Hej! Jestem Llama 3.2 3B od Meta \u2014 najwi\u0119ksza modelowa kt\u00f3ra mo\u017ce wej\u015b\u0107 w 1 GB RAM. Dzia\u0142am lokalnie przez WASM. O czym pogadamy?',\n      },\n      'gemma4-e2b': {\n        name: 'Gemma 4 \u00b7 E2B',\n        // UD-IQ2_M ~2.18 GB \u2014 agresywna kwantyzacja (2.5 bpw)\n        url: 'https://huggingface.co/unsloth/gemma-4-E2B-it-GGUF/resolve/main/gemma-4-E2B-it-UD-IQ2_M.gguf',\n        sizeMb: 2184,\n        nCtx: 512,\n        modelLoadParams: {\n          flash_attn: true,\n          n_batch: 128,\n        },\n        greeting: 'Cze\u015b\u0107! Jestem Gemma 4 E2B od Google, uruchomiona przez WASM. Dzia\u0142a lokalnie na Twoim urz\u0105dzeniu. O czym pogadamy?',\n      },\n      'qwen25-15b': {\n        name: 'Qwen2.5 \u00b7 1.5B',\n        // Q4_K_M ~986 MB \u2014 zgodnie z \u017cyczeniem\n        url: 'https://huggingface.co/bartowski/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf',\n        sizeMb: 986,\n        nCtx: 1024,\n        modelLoadParams: {\n          flash_attn: true,\n          n_batch: 256,\n        },\n        greeting: 'Hej! Jestem Qwen2.5 1.5B \u2014 najwi\u0119kszy z modeli w menu. Dzia\u0142am lokalnie w Twojej przegl\u0105darce. O czym chcesz pogada\u0107?',\n      },\n    };\n\n    const { Wllama } = await import(WLLAMA_IMPORT);\n\n    // ===== Elementy DOM (definiujemy wcze\u015bnie, u\u017cywane w wielu miejscach) =====\n    const $ = (id) => document.getElementById(id);\n    const menuScreen    = $('menu-screen');\n\n    // ===== Cache helper instance (do list/delete bez \u0142adowania modelu) =====\n    let cacheWllama = null;\n    async function getCacheWllama() {\n      if (!cacheWllama) {\n        cacheWllama = new Wllama(ASSETS_PATH, { allowOffline: true });\n      }\n      return cacheWllama;\n    }\n\n    // ===== Pobieranie modelu (z obs\u0142ug\u0105 pauzy) =====\n    const pauseBtn = $('pause-btn');\n\n    async function downloadAndLoadModel(model) {\n      isDownloading = true;\n      isPaused = false;\n      currentDownloadModel = model;\n      // Pokazujemy przycisk pauzy od razu \u2014 \u0142atwiej go klikn\u0105\u0107 w trakcie pobierania\n      pauseBtn.style.display = 'block';\n      pauseBtn.textContent = '\u23f8\ufe0f Pauza';\n      pauseBtn.disabled = false;\n\n      let hasStartedDownloading = false;\n\n      // P\u0119tla: pobieranie \u2014 mo\u017cliwa pauza i wznowienie\n      while (true) {\n        downloadAbortController = new AbortController();\n        try {\n          await wllama.loadModelFromUrl(model.url, {\n            n_ctx: model.nCtx,\n            n_threads: Math.min(4, navigator.hardwareConcurrency || 4),\n            n_gpu_layers: 0,\n            useCache: true,\n            signal: downloadAbortController.signal,\n            progressCallback: ({ loaded, total }) => {\n              if (!total) return;\n              if (!hasStartedDownloading && loaded < total) {\n                hasStartedDownloading = true;\n              }\n              currentDownloadProgress = { loaded, total };\n              const pct = Math.min(100, Math.round((loaded / total) * 100));\n              progressBar.style.width = pct + '%';\n              const mbLoaded = (loaded / 1024 / 1024).toFixed(0);\n              const mbTotal  = (total  / 1024 / 1024).toFixed(0);\n              progressText.textContent = `Pobieranie modelu: ${pct}% (${mbLoaded}/${mbTotal} MB)`;\n            },\n            ...(model.modelLoadParams || {}),\n          });\n          // Sukces \u2014 wychodzimy z p\u0119tli\n          break;\n        } catch (e) {\n          if (e?.name === 'AbortError' || /abort/i.test(e?.message || '') || downloadAbortController?.signal.aborted) {\n            // U\u017cytkownik pauzowa\u0142\n            if (isPaused) {\n              progressText.textContent = '\u23f8\ufe0f Pobrano cz\u0119\u015b\u0107 modelu. Kliknij \u201eWzn\u00f3w\u201d, aby kontynuowa\u0107.';\n              pauseBtn.textContent = '\u25b6\ufe0f Wzn\u00f3w';\n              pauseBtn.disabled = false;\n              // Czekamy a\u017c u\u017cytkownik kliknie \u201eWzn\u00f3w\"\n              await new Promise(resolve => {\n                const handler = () => {\n                  if (!isPaused) {\n                    pauseBtn.removeEventListener('click', handler);\n                    resolve();\n                  }\n                };\n                pauseBtn.addEventListener('click', handler);\n              });\n              // Po wznowieniu \u2014 p\u0119tla leci dalej, loadModelFromUrl pobierze reszt\u0119 z cache\n              continue;\n            } else {\n              // Anulowano ca\u0142kowicie (np. \u201eWr\u00f3\u0107 do menu\u201d)\n              throw e;\n            }\n          } else {\n            // Inny b\u0142\u0105d\n            throw e;\n          }\n        }\n      }\n\n      isDownloading = false;\n      pauseBtn.style.display = 'none';\n    }\n\n    pauseBtn.addEventListener('click', () => {\n      if (!isDownloading) return;\n      if (!isPaused) {\n        // Pauzujemy \u2014 abort obecnego pobierania\n        isPaused = true;\n        pauseBtn.disabled = true;\n        pauseBtn.textContent = 'Pauzowanie\u2026';\n        try { downloadAbortController?.abort(); } catch (e) {}\n      } else {\n        // Wznawiamy\n        isPaused = false;\n        pauseBtn.disabled = true;\n        pauseBtn.textContent = 'Wznawianie\u2026';\n        // Handler w downloadAndLoadModel sam to obs\u0142u\u017cy\n      }\n    });\n\n    // ===== Elementy DOM =====\n    const loadingScreen = $('loading-screen');\n    const chatScreen    = $('chat-screen');\n    const loadingTitle  = $('loading-title');\n    const progressBar   = $('progress-bar');\n    const progressText  = $('progress-text');\n    const errorBox      = $('error-box');\n    const backBtn       = $('back-btn');\n    const headerTitle   = $('header-title');\n    const headerModel   = $('header-model');\n    const changeModelBtn= $('change-model-btn');\n    const messagesEl    = $('messages');\n    const promptEl      = $('prompt');\n    const sendBtn       = $('send-btn');\n    const statusDot     = $('status-dot');\n\n    let wllama = null;\n    let currentModelKey = null;\n    let isGenerating = false;\n    let chatHistory = [];\n    let currentAbortController = null;\n    let sendIcon, stopIcon;\n\n    // ===== Stan pobierania modelu (do pauzy/wznowienia) =====\n    let downloadAbortController = null;\n    let isDownloading = false;\n    let isPaused = false;\n    let currentDownloadModel = null;\n    let currentDownloadProgress = { loaded: 0, total: 0 };\n\n    // ===== Usuwanie plik\u00f3w =====\n    const deleteScreen  = $('delete-screen');\n    const deleteList    = $('delete-list');\n    const manageBtn     = $('manage-files-btn');\n    const deleteAllBtn  = $('delete-all-btn');\n    const deleteBackBtn = $('delete-back-btn');\n\n    async function getCachedSize(url) {\n      try {\n        const w = await getCacheWllama();\n        const name = await w.cacheManager.getNameFromURL(url);\n        const size = await w.cacheManager.getSize(name);\n        return size > 0 ? size : 0;\n      } catch { return 0; }\n    }\n\n    function fmtSize(bytes) {\n      if (bytes >= 1024 * 1024 * 1024) return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';\n      if (bytes >= 1024 * 1024) return (bytes / 1024 / 1024).toFixed(0) + ' MB';\n      if (bytes >= 1024) return (bytes / 1024).toFixed(0) + ' KB';\n      return bytes + ' B';\n    }\n\n    async function renderDeleteList() {\n      deleteList.innerHTML = '<div style=\"text-align:center;color:#888;padding:20px\">Sprawdzanie cache\u2026<\/div>';\n      const w = await getCacheWllama();\n\n      const entries = [];\n      for (const [key, model] of Object.entries(MODELS)) {\n        const size = await getCachedSize(model.url);\n        entries.push({ key, model, size });\n      }\n\n      deleteList.innerHTML = '';\n      for (const { key, model, size } of entries) {\n        const cached = size > 0;\n        const row = document.createElement('div');\n        row.className = 'delete-row';\n        row.innerHTML = `\n          <div class=\"info\">\n            <div class=\"name\">${model.name}<\/div>\n            <div class=\"meta ${cached ? 'cached' : ''}\">\n              ${cached ? '\u2713 Pobrany \u00b7 ' + fmtSize(size) : 'Nie pobrano'}\n            <\/div>\n          <\/div>\n          <button class=\"delete-btn\" data-key=\"${key}\" ${cached ? '' : 'disabled'}>Usu\u0144<\/button>\n        `;\n        deleteList.appendChild(row);\n      }\n\n      // Pod\u0142\u0105cz eventy\n      deleteList.querySelectorAll('.delete-btn').forEach(btn => {\n        btn.addEventListener('click', async () => {\n          const key = btn.dataset.key;\n          const model = MODELS[key];\n          if (!model) return;\n          btn.disabled = true;\n          btn.textContent = 'Usuwanie\u2026';\n          try {\n            const w = await getCacheWllama();\n            await w.cacheManager.delete(model.url);\n            btn.textContent = 'Usuni\u0119to';\n          } catch (e) {\n            console.error(e);\n            btn.textContent = 'B\u0142\u0105d';\n            btn.disabled = false;\n          }\n          // Od\u015bwie\u017c list\u0119 po chwili\n          setTimeout(renderDeleteList, 500);\n        });\n      });\n\n      // Aktualizuj przycisk \"Usu\u0144 wszystko\"\n      const anyCached = entries.some(e => e.size > 0);\n      deleteAllBtn.disabled = !anyCached;\n    }\n\n    manageBtn.addEventListener('click', async () => {\n      menuScreen.hidden = true;\n      deleteScreen.classList.add('active');\n      await renderDeleteList();\n    });\n\n    deleteBackBtn.addEventListener('click', () => {\n      deleteScreen.classList.remove('active');\n      menuScreen.hidden = false;\n    });\n\n    deleteAllBtn.addEventListener('click', async () => {\n      if (!confirm('Usun\u0105\u0107 wszystkie pobrane modele z cache przegl\u0105darki?')) return;\n      deleteAllBtn.disabled = true;\n      deleteAllBtn.textContent = 'Usuwanie\u2026';\n      try {\n        const w = await getCacheWllama();\n        await w.cacheManager.clear();\n        deleteAllBtn.textContent = 'Usuni\u0119to';\n      } catch (e) {\n        console.error(e);\n        deleteAllBtn.textContent = 'B\u0142\u0105d';\n      }\n      setTimeout(renderDeleteList, 500);\n    });\n\n    // ===== Wyb\u00f3r modelu z menu =====\n    document.querySelectorAll('.model-card').forEach(card => {\n      card.addEventListener('click', () => {\n        const key = card.dataset.model;\n        startLoading(key);\n      });\n    });\n\n    async function startLoading(modelKey) {\n      const model = MODELS[modelKey];\n      if (!model) return;\n\n      currentModelKey = modelKey;\n      menuScreen.hidden = true;\n      loadingScreen.classList.add('active');\n      loadingTitle.textContent = model.name;\n      progressBar.style.width = '0%';\n      progressText.textContent = 'Inicjalizacja WASM\u2026';\n      errorBox.textContent = '';\n\n      try {\n        if (wllama) {\n          try { await wllama.exit(); } catch (e) {}\n          wllama = null;\n        }\n\n        wllama = new Wllama(ASSETS_PATH, {\n          allowOffline: true,\n          suppressNativeLog: false,\n        });\n\n        await downloadAndLoadModel(model).catch(e => {\n          // Bardziej czytelny komunikat b\u0142\u0119du\n          throw new Error(`${e?.message || e}\\n\\nTypowe przyczyny:\\n\u2022 model za du\u017cy na dost\u0119pny RAM\\n\u2022 uszkodzony cache \u2014 wyczy\u015b\u0107 dane strony\\n\u2022 starsza wersja przegl\u0105darki`);\n        });\n\n        progressText.textContent = 'Gotowe!';\n        chatHistory = [];\n        messagesEl.innerHTML = '';\n\n        setTimeout(() => {\n          loadingScreen.classList.remove('active');\n          chatScreen.hidden = false;\n          headerTitle.textContent = 'Qwen Chat';\n          headerModel.textContent = model.name;\n          sendBtn.disabled = false;\n          promptEl.focus();\n          addMessage('assistant', model.greeting);\n        }, 300);\n      } catch (e) {\n        console.error(e);\n        errorBox.textContent = 'B\u0142\u0105d: ' + (e?.message || e);\n      }\n    }\n\n    // ===== Powr\u00f3t do menu =====\n    async function backToMenu() {\n      // Je\u015bli trwa pobieranie \u2014 anulujemy je\n      if (isDownloading && downloadAbortController) {\n        isPaused = false; // nie traktujemy jako pauz\u0119\n        try { downloadAbortController.abort(); } catch (e) {}\n      }\n      if (wllama) {\n        try { await wllama.exit(); } catch (e) {}\n        wllama = null;\n      }\n      isDownloading = false;\n      pauseBtn.style.display = 'none';\n      currentModelKey = null;\n      chatHistory = [];\n      loadingScreen.classList.remove('active');\n      chatScreen.hidden = true;\n      menuScreen.hidden = false;\n    }\n\n    backBtn.addEventListener('click', backToMenu);\n    changeModelBtn.addEventListener('click', backToMenu);\n\n    // ===== Wysy\u0142ka wiadomo\u015bci / Stop =====\n    function setSendButtonMode(mode) {\n      // 'send' = ikonka strza\u0142ki, 'stop' = ikonka kwadratu (aktywny)\n      sendIcon = sendIcon || $('send-icon');\n      stopIcon = stopIcon || $('stop-icon');\n      if (mode === 'stop') {\n        sendBtn.classList.add('stop-mode');\n        sendBtn.disabled = false;\n        sendBtn.setAttribute('aria-label', 'Zatrzymaj');\n        sendIcon.style.display = 'none';\n        stopIcon.style.display = 'block';\n      } else {\n        sendBtn.classList.remove('stop-mode');\n        sendBtn.setAttribute('aria-label'  size/2, by - size); ctx.lineTo(sx + size, by); ctx.closePath(); ctx.fill();\n      ctx.strokeStyle = '#ff8800'; ctx.lineWidth = 1.5; ctx.stroke();\n      ctx.restore();\n    } else if (obs.type === 'block') {\n      ctx.save();\n      const gr = ctx.createLinearGradient(sx, gy - obs.h, sx, gy);\n      gr.addColorStop(0, '#1a4035'); gr.addColorStop(1, '#0a2018');\n      ctx.fillStyle = gr; ctx.fillRect(sx, gy - obs.h, obs.w, obs.h);\n      ctx.fillStyle = '#00ff88'; ctx.fillRect(sx, gy - obs.h, obs.w, 4);\n      ctx.strokeStyle = 'rgba(0, 255, 136, 0.5)'; ctx.lineWidth = 1; ctx.strokeRect(sx + 2, gy - obs.h + 2, obs.w - 4, obs.h - 4);\n      ctx.restore();\n    }\n  }\n}\n\nfunction drawPlayer() {\n  ctx.save();\n  ctx.translate(player.x + player.size/2, player.y + player.size/2);\n  ctx.rotate(player.rotation); ctx.scale(player.scaleX, player.scaleY);\n  const s = player.size;\n  \n  ctx.fillStyle = '#ff2d75';\n  ctx.fillRect(-s/2, -s/2, s, s);\n  \n  ctx.fillStyle = '#ff5c9d'; ctx.fillRect(-s/2 + 3, -s/2 + 3, s - 6, s - 6);\n  ctx.fillStyle = '#ff2d75'; ctx.fillRect(-s/2 + 7, -s/2 + 7, s - 14, s - 14);\n  ctx.fillStyle = '#fff'; ctx.fillRect(-9, -3, 5, 7); ctx.fillRect(4, -3, 5, 7);\n  ctx.fillStyle = '#000'; ctx.fillRect(-7, -1, 2, 4); ctx.fillRect(6, -1, 2, 4);\n  ctx.restore();\n}\n\nfunction drawParticles() {\n  for (const p of particles) {\n    ctx.save(); ctx.globalAlpha = Math.min(1, p.life); ctx.fillStyle = p.color;\n    const size = p.size * Math.min(1, p.life / p.maxLife);\n    ctx.fillRect(p.x - size/2, p.y - size/2, size, size); ctx.restore();\n  }\n}\n\nfunction drawFlash() { if (game.flash > 0) { ctx.fillStyle = `rgba(255, 255, 255, ${game.flash})`; ctx.fillRect(0, 0, W, H); } }\n\nfunction drawUI() {\n  if (game.state === 'menu') return;\n  const btnSize = Math.min(30, W * 0.08, H * 0.08);\n  const gap = Math.min(15, W * 0.04);\n  const bw = Math.min(W * 0.6, 500); \n  const bh = 14;\n  const totalUIW = bw + gap + btnSize;\n  const startX = (W - tot n.y + btn.h) {\n        if (btn.action === 'resume') { game.state = 'playing'; startMusic(); }\n        else if (btn.action === 'menu') { game.state = 'menu'; game.subMenu = 'main'; stopMusic(); }\n        return;\n      }\n    }\n    return;\n  }\n\n  if (game.state === 'playing') {\n    const btnSize = Math.min(30, W * 0.08, H * 0.08);\n    const gap = Math.min(15, W * 0.04);\n    const bw = Math.min(W * 0.6, 500); \n    const totalUIW = bw + gap + btnSize;\n    const startX = (W - totalUIW) / 2;\n    const bx = startX;\n    const by = 20;\n    const btnX = bx + bw + gap;\n    const btnY = by - 8;\n    if (clickX >= btnX && clickX <= btnX + btnSize && clickY >= btnY && clickY <= btnY + btnSize) {\n      game.state = 'paused'; stopMusic(); return;\n    }\n  }\n\n  if (game.state === 'won') { game.state = 'menu'; game.subMenu = 'main'; return; }\n  inputHeld = true; jump();\n}\n\nfunction handleUp() { inputHeld = false; }\n\ncanvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleDown(e); }, { passive: false });\nwindow.addEventListener('touchend', handleUp);\nwindow.addEventListener('touchcancel', handleUp);\ncanvas.addEventListener('mousedown', handleDown);\nwindow.addEventListener('mouseup', handleUp);\n\nwindow.addEventListener('keydown', (e) => { \n  if (e.code === 'Space') { \n    e.preventDefault(); \n    if (game.state === 'menu' && game.subMenu === 'main') { game.subMenu = 'levels'; return; }\n    if (game.state === 'menu' && game.subMenu === 'levels') { game.subMenu = 'easy'; return; }\n    if (game.state === 'menu' && game.subMenu === 'easy') { startGame(0); return; }\n    if (game.state === 'dead') { startGame(currentLevel); return; }\n    if (game.state === 'won') { game.state = 'menu'; game.subMenu = 'main'; return; }\n    if (game.state === 'paused') { game.state = 'playing'; startMusic(); return; }\n    if (!inputHeld) handleDown(e); \n  }\n});\nwindow.addEventListener('keyup', (e) => { if (e.code === 'Space') handleUp(); });\n\nwind ound: rgba(0,0,0,0.75);\n      backdrop-filter: blur(2px);\n      z-index: 100;\n      align-items: center;\n      justify-content: center;\n      padding: 24px;\n    }\n    .modal-overlay.active { display: flex; }\n    .modal {\n      background: #1a1a1a;\n      border: 1px solid #3f3f3f;\n      border-radius: 12px;\n      max-width: 560px;\n      width: 100%;\n      max-height: 85vh;\n      overflow: hidden;\n      display: flex;\n      flex-direction: column;\n      box-shadow: 0 12px 36px rgba(0,0,0,0.6);\n    }\n    .modal-header {\n      padding: 16px 20px;\n      border-bottom: 1px solid #2a2a2a;\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n    }\n    .modal-header h2 {\n      margin: 0;\n      font-size: 1.05rem;\n      font-weight: 600;\n      color: #fff;\n    }\n    .modal-close {\n      background: none;\n      border: none;\n      color: #aaa;\n      font-size: 1.4rem;\n      cursor: pointer;\n      line-height: 1;\n      padding: 0 4px;\n    }\n    .modal-close:hover { color: #fff; }\n    .modal-body {\n      padding: 16px 20px;\n      overflow-y: auto;\n    }\n    .modal-footer {\n      padding: 12px 20px;\n      border-top: 1px solid #2a2a2a;\n      display: flex;\n      gap: 8px;\n      justify-content: flex-end;\n    }\n\n    /* Prze\u0142\u0105cznik (toggle) */\n    .setting-row {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      padding: 10px 0;\n      gap: 16px;\n    }\n    .setting-row .label {\n      font-size: 0.95rem;\n      color: #f1f1f1;\n    }\n    .toggle {\n      position: relative;\n      width: 44px;\n      height: 24px;\n      flex-shrink: 0;\n    }\n    .toggle input { display: none; }\n    .toggle .slider {\n      position: absolute;\n      inset: 0;\n      background: #444;\n      border-radius: 12px;\n      transition: background 0.2s;\n      cursor: pointer;\n    }\n    .toggle .slider::before {\n      content: '';\n      position: absolute;\n      top: 3px;\n      left: 3px;\n      width: 18px;\n      height: 18px;\n      background: #fff;\n      border-radius: 50%;\n      transition: transform 0.2s;\n    }\n    .toggle input:checked + .slider { background: #ff0000; }\n    .toggle input:checked + .slider::before { transform: translateX(20px); }\n\n    /* Lista pobranych film\u00f3w w modalu */\n    .cached-list { display: flex; flex-direction: column; gap: 8px; }\n    .cached-item {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 12px;\n      padding: 10px 12px;\n      background: #272727;\n      border: 1px solid #3f3f3f;\n      border-radius: 8px;\n    }\n    .cached-item .name {\n      font-size: 0.9rem;\n      color: #f1f1f1;\n      word-break: break-all;\n    }\n    .cached-item .size {\n      font-size: 0.75rem;\n      color: #888;\n      margin-top: 2px;\n    }\n    .cached-item button {\n      background: #5b1b1b;\n      color: #ff8888;\n      border: 1px solid #8c2d2d;\n      padding: 6px 12px;\n      border-radius: 6px;\n      cursor: pointer;\n      font-size: 0.8rem;\n      flex-shrink: 0;\n      transition: background 0.2s;\n    }\n    .cached-item button:hover { background: #8c2d2d; color: #fff; }\n    .modal-empty {\n      text-align: center;\n      color: #888;\n      padding: 24px 0;\n      font-size: 0.9rem;\n    }\n    .btn-danger {\n      background: #5b1b1b !important;\n      color: #ff8888 !important;\n      border: 1px solid #8c2d2d !important;\n    }\n    .btn-danger:hover { background: #8c2d2d !important; color: #fff !important; }\n\n    /* \u2500\u2500\u2500 Wyszukiwarka \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n    .search-bar {\n      max-width: 900px;\n      margin: 0 auto 16px;\n      display: flex;\n      align-items: center;\n      background: #1a1a1a;\n      border: 1px solid #3f3f3f;\n      border-radius: 24px;\n      padding: 0 16px;\n      transition: border-color 0.2s, box-shadow 0.2s;\n    }\n    .search-bar:focus-within {\n      border-color: #ff0000;\n      box-shadow: 0 0 0 3px rgba(255,0,0,0.15);\n    }\n    .search-bar svg {\n      width: 18px;\n      height: 18px;\n      color: #888;\n      flex-shrink: 0;\n    }\n    .search-bar input {\n      flex: 1;\n      background: transparent;\n      border: none;\n      color: #f1f1f1;\n      font-size: 0.95rem;\n      padding: 12px 12px;\n      outline: none;\n      font-family: inherit;\n    }\n    .search-bar input::placeholder { color: #777; }\n    .search-bar .clear-search {\n      background: none;\n      border: none;\n      color: #888;\n      cursor: pointer;\n      font-size: 1.2rem;\n      line-height: 1;\n      padding: 0 4px;\n      display: none;\n    }\n    .search-bar .clear-search:hover { color: #fff; }\n    .search-bar .clear-search.visible { display: inline; }\n  <\/style>\n<\/head>\n<body>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n       EKRAN 1 \u2014 STRONA G\u0141\u00d3WNA (lista film\u00f3w)\n       \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div id=\"view-home\">\n    <div class=\"header\">\n      <h1>\u25b6 SKJtube<\/h1>\n      <div class=\"subtitle\">Alternatywa dla YouTube<\/div>\n    <\/div>\n\n    <div class=\"search-bar\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n        <circle cx=\"11\" cy=\"11\" r=\"8\"><\/circle>\n        <line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"><\/line>\n      <\/svg>\n      <input type=\"text\" id=\"searchInput\" placeholder=\"Szukaj film\u00f3w\u2026\" autocomplete=\"off\">\n      <button class=\"clear-search\" id=\"clearSearchBtn\" title=\"Wyczy\u015b\u0107\">\u00d7<\/button>\n    <\/div>\n\n    <div id=\"status\">\u0141adowanie listy film\u00f3w\u2026<\/div>\n\n    <div class=\"buttons\" id=\"buttons\"><\/div>\n\n    <div class=\"controls-bar\" id=\"controlsBar\" style=\"display:none;\">\n      <button id=\"settingsBtn\">Ustawienia<\/button>\n      <button id=\"clearCacheBtn\">Wyczy\u015b\u0107 pobrane filmy<\/button>\n    <\/div>\n  <\/div>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n       MODAL \u2014 USTAWIENIA\n       \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div class=\"modal-overlay\" id=\"settingsModal\">\n    <div class=\"modal\">\n      <div class=\"modal-header\">\n        <h2>Ustawienia<\/h2>\n        <button class=\"modal-close\" data-close=\"settingsModal\">\u00d7<\/button>\n      <\/div>\n      <div class=\"modal-body\">\n        <div class=\"setting-row\">\n          <div class=\"label\">Usuwaj film od razu po wyj\u015bciu z filmu<\/div>\n          <label class=\"toggle\">\n            <input type=\"checkbox\" id=\"autoDeleteToggle\">\n            <span class=\"slider\"><\/span>\n          <\/label>\n        <\/div>\n      <\/div>\n      <div class=\"modal-footer\">\n        <button data-close=\"settingsModal\" style=\"background:#272727;color:#aaa;border:1px solid #3f3f3f;padding:6px 14px;border-radius:6px;cursor:pointer;\">Zamknij<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n       MODAL \u2014 WYCZY\u015a\u0106 POBRANE FILMY\n       \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div class=\"modal-overlay\" id=\"clearCacheModal\">\n    <div class=\"modal\">\n      <div class=\"modal-header\">\n        <h2>Pobrane filmy<\/h2>\n        <button class=\"modal-close\" data-close=\"clearCacheModal\">\u00d7<\/button>\n      <\/div>\n      <div class=\"modal-body\" id=\"clearCacheBody\"><\/div>\n      <div class=\"modal-footer\">\n        <button id=\"deleteAllBtn\" class=\"btn-danger\" style=\"padding:6px 14px;border-radius:6px;cursor:pointer;\">Usu\u0144 wszystko<\/button>\n        <button data-close=\"clearCacheModal\" style=\"background:#272727;color:#aaa;border:1px solid #3f3f3f;padding:6px 14px;border-radius:6px;cursor:pointer;\">Zamknij<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n       EKRAN 2 \u2014 ODTWARZACZ\n       \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div id=\"view-player\">\n    <div class=\"player-topbar\">\n      <button class=\"back-btn\" id=\"backBtn\">\u2190 Wstecz<\/button>\n      <div class=\"player-title\" id=\"playerTitle\"><\/div>\n    <\/div>\n\n    <div class=\"video-container\">\n      <video id=\"player\" controls playsinline><\/video>\n    <\/div>\n\n    <div id=\"player-status\"><\/div>\n  <\/div>\n\n  <script>\n    // \u2500\u2500\u2500 Konfiguracja \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    const DRIVE_API_KEY   = 'AIzaSyC2lM9X_eBiC-bnPQjr0r72tH-RnCx67KM';\n    const DRIVE_FOLDER_ID = '1AL5sfTVR7Q8HR5fImWvrpw9JUFhFzw0C';\n    const DRIVE_API_BASE  = 'https://www.googleapis.com/drive/v3';\n\n    // \u2500\u2500\u2500 Ustawienia (localStorage) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    const LS_AUTODELETE_KEY = 'skjtube.autoDeleteOnExit';\n    function getAutoDelete() { return localStorage.getItem(LS_AUTODELETE_KEY) === '1'; }\n    function setAutoDelete(v) { localStorage.setItem(LS_AUTODELETE_KEY, v ? '1' : '0'); }\n\n    // \u2500\u2500\u2500 Nawigacja mi\u0119dzy ekranami \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    let currentFileName = null; // nazwa pliku aktualnie odtwarzanego\n\n    async function showHome() {\n      // zatrzymaj odtwarzanie przy powrocie\n      const player = document.getElementById('player');\n      try { player.pause(); } catch(_) {}\n      player.removeAttribute('src');\n      player.load();\n      if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }\n\n      // je\u015bli w\u0142\u0105czone auto-usuwanie \u2014 usu\u0144 aktualny film z pami\u0119ci\n      const fileToDelete = currentFileName;\n      currentFileName = null;\n      if (fileToDelete && getAutoDelete()) {\n        try {\n          await deleteVideo(fileToDelete);\n          const btn = document.querySelector(`button[data-name=\"${CSS.escape(fileToDelete)}\"]`);\n          if (btn) btn.classList.remove('cached');\n          document.getElementById('status').textContent =\n            `Film \u201e${fileToDelete.replace(/\\.mp4$/i, '')}\u201d zosta\u0142 usuni\u0119ty z pami\u0119ci.`;\n        } catch (err) {\n          console.error('Auto-delete failed:', err);\n        }\n      }\n\n      document.getElementById('view-home').classList.remove('hidden');\n      document.getElementById('view-player').classList.remove('active');\n      // odznacz aktywne przyciski\n      document.querySelectorAll('button.video-btn').forEach(b => b.classList.remove('playing'));\n    }\n\n    function showPlayer(label) {\n      document.getElementById('playerTitle').textContent = label;\n      document.getElementById('view-home').classList.add('hidden');\n      document.getElementById('view-player').classList.add('active');\n      window.scrollTo({ top: 0, behavior: 'smooth' });\n    }\n\n    document.getElementById('backBtn').addEventListener('click', showHome);\n\n    // \u2500\u2500\u2500 IndexedDB (pami\u0119\u0107 przegl\u0105darki dla du\u017cych plik\u00f3w) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    function openDB() {\n      return new Promise((resolve, reject) => {\n        const req = indexedDB.open('SKJtubeDB', 1);\n        req.onupgradeneeded = (e) => {\n          const db = e.target.result;\n          if (!db.objectStoreNames.contains('videos')) {\n            db.createObjectStore('videos', { keyPath: 'name' });\n          }\n        };\n        req.onsuccess = (e) => resolve(e.target.result);\n        req.onerror   = (e) => reject(e.target.error);\n      });\n    }\n\n    async function getCachedVideo(name) {\n      const db = await openDB();\n      return new Promise((resolve, reject) => {\n        const tx = db.transaction('videos', 'readonly');\n        const req = tx.objectStore('videos').get(name);\n        req.onsuccess = () => resolve(req.result ? req.result.blob : null);\n        req.onerror   = () => reject(req.error);\n      });\n    }\n\n    async function cacheVideo(name, blob) {\n      const db = await openDB();\n      return new Promise((resolve, reject) => {\n        const tx = db.transaction('videos', 'readwrite');\n        tx.objectStore('videos').put({ name, blob });\n        tx.oncomplete = () => resolve();\n        tx.onerror    = () => reject(tx.error);\n      });\n    }\n\n    async function clearCache() {\n      const db = await openDB();\n      return new Promise((resolve, reject) => {\n        const tx = db.transaction('videos', 'readwrite');\n        tx.objectStore('videos').clear();\n        tx.oncomplete = () => resolve();\n        tx.onerror    = () => reject(tx.error);\n      });\n    }\n\n    async function deleteVideo(name) {\n      const db = await openDB();\n      return new Promise((resolve, reject) => {\n        const tx = db.transaction('videos', 'readwrite');\n        tx.objectStore('videos').delete(name);\n        tx.oncomplete = () => resolve();\n        tx.onerror    = () => reject(tx.error);\n      });\n    }\n\n    async function listCachedVideos() {\n      const db = await openDB();\n      return new Promise((resolve, reject) => {\n        const tx = db.transaction('videos', 'readonly');\n        const req = tx.objectStore('videos').getAll();\n        req.onsuccess = () => resolve(req.result || []);\n        req.onerror   = () => reject(req.error);\n      });\n    }\n\n    // \u2500\u2500\u2500 Google Drive API \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    async function fetchVideoList() {\n      // query: pliki w danym folderze, niewyrzucone, typu video/mp4\n      const q = encodeURIComponent(\n        `'${DRIVE_FOLDER_ID}' in parents and trashed=false and mimeType='video/mp4'`\n      );\n      const fields = encodeURIComponent('files(id,name,mimeType,size)');\n      const url = `${DRIVE_API_BASE}/files?q=${q}&fields=${fields}&orderBy=name&pageSize=1000&key=${DRIVE_API_KEY}`;\n      const res = await fetch(url);\n      if (!res.ok) {\n        let msg = `HTTP ${res.status}`;\n        try {\n          const err = await res.json();\n          if (err.error?.message) msg = err.error.message;\n        } catch (_) {}\n        throw new Error(`Nie mo\u017cna pobra\u0107 listy plik\u00f3w: ${msg}`);\n      }\n      const data = await res.json();\n      return Array.isArray(data.files) ? data.files : [];\n    }\n\n    function driveDownloadUrl(fileId) {\n      return `${DRIVE_API_BASE}/files/${fileId}?alt=media&key=${DRIVE_API_KEY}`;\n    }\n\n    // \u2500\u2500\u2500 Odtwarzacz \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    let currentBlobUrl = null;\n\n    async function playVideo(fileName, fileId) {\n      const player   = document.getElementById('player');\n      const pstatus  = document.getElementById('player-status');\n      const btn      = document.querySelector(`button[data-name=\"${CSS.escape(fileName)}\"]`);\n\n      // oznacz aktywny przycisk na li\u015bcie (na p\u00f3\u017aniej, jak wr\u00f3cimy)\n      document.querySelectorAll('button.video-btn').forEach(b => b.classList.remove('playing'));\n      if (btn) { btn.classList.add('loading'); btn.classList.add('playing'); }\n\n      // przejd\u017a do ekranu odtwarzacza\n      const label = fileName.replace(/\\.mp4$/i, '');\n      showPlayer(label);\n\n      try {\n        let blob = await getCachedVideo(fileName);\n\n        if (blob) {\n          pstatus.textContent = `Odtwarzanie z pami\u0119ci (IndexedDB)\u2026`;\n        } else {\n          pstatus.textContent = `Pobieranie \u201e${fileName}\u201d\u2026 (mo\u017ce chwil\u0119 potrwa\u0107)`;\n          const url = driveDownloadUrl(fileId);\n          const res = await fetch(url);\n          if (!res.ok) {\n            let msg = `HTTP ${res.status}`;\n            try {\n              const err = await res.json();\n              if (err.error?.message) msg = err.error.message;\n            } catch (_) {}\n            throw new Error(msg);\n          }\n          blob = await res.blob();\n          await cacheVideo(fileName, blob);\n          pstatus.textContent = `Pobrano i zapisano w pami\u0119ci. Odtwarzanie\u2026`;\n          if (btn) btn.classList.add('cached');\n        }\n\n        if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);\n        currentBlobUrl = URL.createObjectURL(blob);\n        currentFileName = fileName;\n        player.src = currentBlobUrl;\n        await player.play();\n        if (btn) btn.classList.remove('loading');\n        pstatus.textContent = ``;\n      } catch (err) {\n        pstatus.innerHTML = `<span class=\"error\">B\u0142\u0105d: ${err.message}<\/span>`;\n        if (btn) btn.classList.remove('loading');\n      }\n    }\n\n    // \u2500\u2500\u2500 Render listy przycisk\u00f3w \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    async function init() {\n      const status     = document.getElementById('status');\n      const buttonsDiv = document.getElementById('buttons');\n      const controlsBar= document.getElementById('controlsBar');\n\n      try {\n        status.textContent = 'Pobieranie listy film\u00f3w z Google Drive\u2026';\n        const videos = await fetchVideoList();\n\n        if (videos.length === 0) {\n          status.textContent = 'Brak plik\u00f3w .mp4 w folderze Google Drive.';\n          return;\n        }\n\n        buttonsDiv.innerHTML = '';\n        for (const v of videos) {\n          const fileName = v.name;\n          const label    = fileName.replace(/\\.mp4$/i, ''); // ucinamy .mp4\n          const btn      = document.createElement('button');\n          btn.className  = 'video-btn';\n          btn.textContent = label;\n          btn.dataset.name = fileName;\n          btn.dataset.fileId = v.id;          // ID pliku na Drive\n          btn.dataset.label = label.toLowerCase(); // do filtrowania\n\n          const badge = document.createElement('span');\n          badge.className = 'badge';\n          const sizeBytes = parseInt(v.size || '0', 10);\n          const sizeMB = sizeBytes / 1024 / 1024;\n          badge.textContent = sizeMB >= 1\n            ? `${sizeMB.toFixed(1)} MB`\n            : `${(sizeBytes / 1024).toFixed(0)} KB`;\n          btn.appendChild(badge);\n\n          // sprawd\u017a czy jest ju\u017c w pami\u0119ci\n          const cached = await getCachedVideo(fileName);\n          if (cached) btn.classList.add('cached');\n\n          btn.addEventListener('click', () => playVideo(fileName, v.id));\n          buttonsDiv.appendChild(btn);\n        }\n\n        status.textContent = `Znaleziono ${videos.length} film\u00f3w. Kliknij przycisk, aby odtworzy\u0107.`;\n        controlsBar.style.display = 'flex';\n        applySearch(); // zastosuj ewentualny wpisany wcze\u015bniej filtr\n      } catch (err) {\n        status.innerHTML = `<span class=\"error\">B\u0142\u0105d: ${err.message}<\/span>`;\n      }\n    }\n\n    // \u2500\u2500\u2500 Wyszukiwarka \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    const searchInput   = document.getElementById('searchInput');\n    const clearSearchBtn= document.getElementById('clearSearchBtn');\n    const buttonsDiv    = document.getElementById('buttons');\n    const statusEl      = document.getElementById('status');\n    let lastTotalCount  = 0; // liczba wszystkich film\u00f3w (do komunikatu)\n\n    function applySearch() {\n      const query = searchInput.value.trim().toLowerCase();\n      clearSearchBtn.classList.toggle('visible', query.length > 0);\n\n      const allButtons = buttonsDiv.querySelectorAll('button.video-btn');\n      let visibleCount = 0;\n      allButtons.forEach(b => {\n        const label = b.dataset.label || '';\n        const match = !query || label.includes(query);\n        b.style.display = match ? '' : 'none';\n        if (match) visibleCount++;\n      });\n\n      if (allButtons.length === 0) return; // lista jeszcze nie za\u0142adowana\n\n      if (query) {\n        if (visibleCount === 0) {\n          statusEl.innerHTML = `<span style=\"color:#aaa;\">Brak wynik\u00f3w dla \u201e<strong style=\"color:#fff;\">${escapeHtml(searchInput.value.trim())}<\/strong>\u201d.<\/span>`;\n        } else {\n          statusEl.textContent = `Znaleziono ${visibleCount} z ${allButtons.length} film\u00f3w.`;\n        }\n      } else {\n        statusEl.textContent = `Znaleziono ${allButtons.length} film\u00f3w. Kliknij przycisk, aby odtworzy\u0107.`;\n      }\n    }\n\n    function escapeHtml(s) {\n      return s.replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n    }\n\n    searchInput.addEventListener('input', applySearch);\n    clearSearchBtn.addEventListener('click', () => {\n      searchInput.value = '';\n      applySearch();\n      searchInput.focus();\n    });\n    // Esc czy\u015bci wyszukiwark\u0119\n    searchInput.addEventListener('keydown', (e) => {\n      if (e.key === 'Escape') {\n        searchInput.value = '';\n        applySearch();\n      }\n    });\n\n    // \u2500\u2500\u2500 Modal \u2014 pomocnicze \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    function openModal(id) { document.getElementById(id).classList.add('active'); }\n    function closeModal(id) { document.getElementById(id).classList.remove('active'); }\n\n    document.querySelectorAll('[data-close]').forEach(el => {\n      el.addEventListener('click', () => closeModal(el.dataset.close));\n    });\n    // klik poza modalem zamyka\n    document.querySelectorAll('.modal-overlay').forEach(ov => {\n      ov.addEventListener('click', (e) => {\n        if (e.target === ov) closeModal(ov.id);\n      });\n    });\n\n    // \u2500\u2500\u2500 Modal \u2014 Ustawienia \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    const autoDeleteToggle = document.getElementById('autoDeleteToggle');\n    autoDeleteToggle.checked = getAutoDelete();\n    autoDeleteToggle.addEventListener('change', () => {\n      setAutoDelete(autoDeleteToggle.checked);\n    });\n    document.getElementById('settingsBtn').addEventListener('click', () => {\n      autoDeleteToggle.checked = getAutoDelete();\n      openModal('settingsModal');\n    });\n\n    // \u2500\u2500\u2500 Modal \u2014 Wyczy\u015b\u0107 pobrane filmy \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    async function renderClearCacheList() {\n      const body = document.getElementById('clearCacheBody');\n      body.innerHTML = '<div class=\"modal-empty\">\u0141adowanie\u2026<\/div>';\n      try {\n        const items = await listCachedVideos();\n        if (items.length === 0) {\n          body.innerHTML = '<div class=\"modal-empty\">Brak pobranych film\u00f3w.<\/div>';\n          document.getElementById('deleteAllBtn').style.display = 'none';\n          return;\n        }\n        document.getElementById('deleteAllBtn').style.display = '';\n        const list = document.createElement('div');\n        list.className = 'cached-list';\n        for (const it of items) {\n          const row = document.createElement('div');\n          row.className = 'cached-item';\n          const info = document.createElement('div');\n          const name = document.createElement('div');\n          name.className = 'name';\n          name.textContent = it.name.replace(/\\.mp4$/i, '');\n          const size = document.createElement('div');\n          size.className = 'size';\n          size.textContent = `${(it.blob.size / 1024 / 1024).toFixed(1)} MB`;\n          info.appendChild(name);\n          info.appendChild(size);\n          const del = document.createElement('button');\n          del.textContent = 'Usu\u0144';\n          del.addEventListener('click', async () => {\n            try {\n              await deleteVideo(it.name);\n              const btn = document.querySelector(`button[data-name=\"${CSS.escape(it.name)}\"]`);\n              if (btn) btn.classList.remove('cached');\n              renderClearCacheList();\n            } catch (err) {\n              alert('B\u0142\u0105d: ' + err.message);\n            }\n          });\n          row.appendChild(info);\n          row.appendChild(del);\n          list.appendChild(row);\n        }\n        body.innerHTML = '';\n        body.appendChild(list);\n      } catch (err) {\n        body.innerHTML = `<div class=\"modal-empty\"><span class=\"error\">B\u0142\u0105d: ${err.message}<\/span><\/div>`;\n      }\n    }\n\n    document.getElementById('clearCacheBtn').addEventListener('click', () => {\n      openModal('clearCacheModal');\n      renderClearCacheList();\n    });\n\n    document.getElementById('deleteAllBtn').addEventListener('click', async () => {\n      if (!confirm('Usun\u0105\u0107 WSZYSTKIE pobrane filmy?')) return;\n      try {\n        await clearCache();\n        document.querySelectorAll('button.video-btn').forEach(b => b.classList.remove('cached'));\n        document.getElementById('status').textContent = 'Wszystkie pobrane filmy zosta\u0142y usuni\u0119te.';\n        renderClearCacheList();\n      } catch (err) {\n        alert('B\u0142\u0105d: ' + err.message);\n      }\n    });\n\n    init();\n  <\/script>\n<\/body>\n<\/html>\n", "emu": "<!DOCTYPE html>\n<html lang=\"pl\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>SKJemu \u2014 WASM / HTML5 VM<\/title>\n  <style>\n    * { box-sizing: border-box; margin: 0; padding: 0; }\n    html, body { min-height: 100vh; }\n    body {\n      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;\n      background: radial-gradient(ellipse at top, #1a1f2e 0%, #0a0d14 100%);\n      color: #e0e6f0;\n      padding: 20px;\n    }\n\n    header {\n      text-align: center;\n      margin-bottom: 32px;\n      padding: 24px 0 8px;\n    }\n    h1 {\n      font-size: 3.6rem;\n      font-weight: 800;\n      background: linear-gradient(135deg, #00ffaa 0%, #00d4ff 100%);\n      -webkit-background-clip: text;\n      background-clip: text;\n      -webkit-text-fill-color: transparent;\n      letter-spacing: 3px;\n      text-shadow: 0 0 40px rgba(0, 255, 170, 0.15);\n    }\n    .subtitle {\n      color: #6b7a99;\n      font-size: 0.85rem;\n      margin-top: 10px;\n      letter-spacing: 5px;\n      text-transform: uppercase;\n    }\n\n    .controls {\n      max-width: 1100px;\n      margin: 0 auto 24px;\n      display: grid;\n      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));\n      gap: 18px;\n    }\n    .control-card {\n      background: rgba(255, 255, 255, 0.04);\n      border: 1px solid rgba(255, 255, 255, 0.08);\n      border-radius: 14px;\n      padding: 22px;\n      transition: all 0.3s;\n      backdrop-filter: blur(8px);\n    }\n    .control-card:hover {\n      background: rgba(0, 255, 170, 0.05);\n      border-color: rgba(0, 255, 170, 0.3);\n      transform: translateY(-2px);\n    }\n    .step-badge {\n      display: inline-block;\n      width: 24px; height: 24px;\n      line-height: 24px;\n      text-align: center;\n      border-radius: 50%;\n      background: rgba(0, 255, 170, 0.15);\n      color: #00ffaa;\n      font-size: 0.75rem;\n      font-weight: 700;\n      margin-bottom: 10px;\n    }\n    .control-card label {\n      display: block;\n      font-size: 0.75rem;\n      color: #6b7a99;\n      text-transform: uppercase;\n      letter-spacing: 2px;\n      margin-bottom: 14px;\n    }\n    .btn {\n      width: 100%;\n      padding: 14px 18px;\n      background: linear-gradient(135deg, rgba(0, 255, 170, 0.12) 0%, rgba(0, 212, 255, 0.12) 100%);\n      border: 1px solid rgba(0, 255, 170, 0.4);\n      color: #00ffaa;\n      font-size: 0.95rem;\n      font-weight: 600;\n      border-radius: 8px;\n      cursor: pointer;\n      transition: all 0.2s;\n      text-transform: uppercase;\n      letter-spacing: 1px;\n      font-family: inherit;\n    }\n    .btn:hover {\n      background: linear-gradient(135deg, rgba(0, 255, 170, 0.25) 0%, rgba(0, 212, 255, 0.25) 100%);\n      box-shadow: 0 0 24px rgba(0, 255, 170, 0.25);\n    }\n    .btn-run {\n      background: linear-gradient(135deg, #00ffaa 0%, #00d4ff 100%);\n      color: #0a0d14;\n      border: none;\n    }\n    .btn-run:hover {\n      box-shadow: 0 0 32px rgba(0, 255, 170, 0.5);\n      transform: translateY(-2px);\n    }\n    .btn-run:disabled {\n      opacity: 0.4;\n      cursor: wait;\n      transform: none;\n      box-shadow: none;\n    }\n    .btn-secondary {\n      width: 100%;\n      padding: 10px 14px;\n      margin-top: 10px;\n      background: rgba(255, 255, 255, 0.04);\n      border: 1px dashed rgba(0, 212, 255, 0.35);\n      color: #00d4ff;\n      font-size: 0.78rem;\n      font-weight: 500;\n      border-radius: 6px;\n      cursor: pointer;\n      transition: all 0.2s;\n      text-transform: uppercase;\n      letter-spacing: 1px;\n      font-family: inherit;\n    }\n    .btn-secondary:hover {\n      background: rgba(0, 212, 255, 0.1);\n      border-style: solid;\n      box-shadow: 0 0 16px rgba(0, 212, 255, 0.25);\n    }\n    .btn-secondary:disabled {\n      opacity: 0.4;\n      cursor: not-allowed;\n    }\n    .btn-secondary.active {\n      background: rgba(0, 255, 170, 0.12);\n      border-color: #00ffaa;\n      color: #00ffaa;\n      border-style: solid;\n    }\n    .disk-info {\n      margin-top: 10px;\n      font-size: 0.75rem;\n      color: #6b7a99;\n      font-family: 'Consolas', 'Monaco', monospace;\n      min-height: 18px;\n    }\n    .disk-info.has-disk { color: #00ffaa; }\n\n    .file-name {\n      margin-top: 12px;\n      font-size: 0.8rem;\n      color: #00d4ff;\n      word-break: break-all;\n      min-height: 36px;\n      font-family: 'Consolas', 'Monaco', monospace;\n    }\n\n    input[type=\"range\"] {\n      width: 100%;\n      -webkit-appearance: none;\n      appearance: none;\n      height: 6px;\n      background: rgba(255, 255, 255, 0.1);\n      border-radius: 3px;\n      outline: none;\n      margin-top: 8px;\n    }\n    input[type=\"range\"]::-webkit-slider-thumb {\n      -webkit-appearance: none;\n      appearance: none;\n      width: 22px; height: 22px;\n      background: linear-gradient(135deg, #00ffaa 0%, #00d4ff 100%);\n      border-radius: 50%;\n      cursor: pointer;\n      box-shadow: 0 0 12px rgba(0, 255, 170, 0.6);\n    }\n    input[type=\"range\"]::-moz-range-thumb {\n      width: 22px; height: 22px;\n      background: linear-gradient(135deg, #00ffaa 0%, #00d4ff 100%);\n      border-radius: 50%;\n      cursor: pointer;\n      border: none;\n      box-shadow: 0 0 12px rgba(0, 255, 170, 0.6);\n    }\n\n    .ram-display {\n      text-align: center;\n      margin-top: 14px;\n    }\n    .ram-value {\n      font-size: 2.2rem;\n      font-weight: 800;\n      color: #00ffaa;\n      line-height: 1;\n    }\n    .ram-unit {\n      font-size: 0.9rem;\n      color: #6b7a99;\n      margin-left: 4px;\n    }\n    .ram-ticks {\n      display: flex;\n      justify-content: space-between;\n      margin-top: 8px;\n      font-size: 0.7rem;\n      color: #4a5878;\n    }\n\n    #status {\n      max-width: 900px;\n      margin: 0 auto 24px;\n      padding: 14px 22px;\n      background: rgba(0, 0, 0, 0.4);\n      border-left: 3px solid #00ffaa;\n      border-radius: 6px;\n      font-family: 'Consolas', 'Monaco', monospace;\n      font-size: 0.9rem;\n      color: #6b7a99;\n      min-height: 48px;\n      word-break: break-word;\n    }\n    #status.error { border-color: #ff4466; color: #ff8899; }\n    #status.ok    { border-color: #00ffaa; color: #00ffaa; }\n    #status.warn  { border-color: #ffaa00; color: #ffcc66; }\n\n    #screen_wrapper {\n      max-width: 1024px;\n      margin: 0 auto;\n    }\n    #screen_container {\n      background: #000;\n      border-radius: 12px;\n      overflow: hidden;\n      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 255, 170, 0.2);\n      display: none;\n    }\n    #screen_container > div {\n      font-family: monospace;\n      font-size: 14px;\n      line-height: 14px;\n      white-space: pre;\n      color: #fff;\n    }\n    #screen_container > canvas {\n      display: block;\n      width: 100%;\n      image-rendering: pixelated;\n    }\n\n    .toolbar {\n      max-width: 1024px;\n      margin: 16px auto 0;\n      display: flex;\n      gap: 10px;\n      justify-content: center;\n      flex-wrap: wrap;\n    }\n    .toolbar button {\n      padding: 8px 16px;\n      background: rgba(255,255,255,0.06);\n      border: 1px solid rgba(255,255,255,0.12);\n      color: #e0e6f0;\n      border-radius: 6px;\n      cursor: pointer;\n      font-size: 0.8rem;\n      font-family: inherit;\n    }\n    .toolbar button:hover { background: rgba(0,255,170,0.12); border-color: rgba(0,255,170,0.4); }\n\n    footer {\n      text-align: center;\n      margin-top: 40px;\n      color: #6b7a99;\n      font-size: 0.8rem;\n      line-height: 1.6;\n    }\n    footer a { color: #00d4ff; text-decoration: none; }\n\n    /* ===== Panel log\u00f3w (widoczny na stronie) ===== */\n    .log-panel {\n      max-width: 1100px;\n      margin: 24px auto 0;\n      background: #000;\n      border: 1px solid rgba(0, 255, 170, 0.25);\n      border-radius: 10px;\n      overflow: hidden;\n      box-shadow: 0 8px 24px rgba(0,0,0,0.5);\n    }\n    .log-header {\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      padding: 8px 14px;\n      background: rgba(0, 255, 170, 0.08);\n      border-bottom: 1px solid rgba(0, 255, 170, 0.2);\n      font-size: 0.78rem;\n      color: #00ffaa;\n      font-family: 'Consolas', 'Monaco', monospace;\n      letter-spacing: 1px;\n      text-transform: uppercase;\n    }\n    .log-header button {\n      background: none;\n      border: 1px solid rgba(0,255,170,0.4);\n      color: #00ffaa;\n      font-size: 0.7rem;\n      padding: 3px 8px;\n      border-radius: 4px;\n      cursor: pointer;\n      font-family: inherit;\n    }\n    .log-header button:hover { background: rgba(0,255,170,0.15); }\n    #log-content {\n      height: 320px;\n      overflow-y: auto;\n      padding: 10px 14px;\n      font-family: 'Consolas', 'Monaco', monospace;\n      font-size: 0.78rem;\n      line-height: 1.45;\n      color: #c8d4e8;\n      white-space: pre-wrap;\n      word-break: break-word;\n      -webkit-overflow-scrolling: touch;\n    }\n    #log-content .log-line { display: block; padding: 1px 0; }\n    #log-content .log-time { color: #4a5878; margin-right: 6px; }\n    #log-content .log-warn { color: #ffcc66; }\n    #log-content .log-error { color: #ff6688; }\n    #log-content .log-info { color: #c8d4e8; }\n    #log-content .log-debug { color: #6b7a99; }\n    .log-panel.collapsed #log-content { display: none; }\n    .log-panel.collapsed .log-toggle::after { content: '\u25be'; }\n    .log-toggle::after { content: '\u25b4'; margin-left: 4px; }\n\n    @media (max-width: 760px) {\n      .controls { grid-template-columns: 1fr; }\n      h1 { font-size: 2.4rem; letter-spacing: 2px; }\n    }\n\n    #screen_wrapper { position: relative; }\n    #screen_wrapper:-webkit-full-screen { background: #000; width: 100vw; height: 100vh; }\n    #screen_wrapper:-moz-full-screen    { background: #000; width: 100vw; height: 100vh; }\n    #screen_wrapper:-ms-full-screen     { background: #000; width: 100vw; height: 100vh; }\n    #screen_wrapper:fullscreen          { background: #000; width: 100vw; height: 100vh; }\n\n    /* ===== P\u0142ywaj\u0105ce przyciski (FAB) \u2014 mobile ===== */\n    .fab {\n      position: fixed !important;\n      width: 56px; height: 56px;\n      border-radius: 50%;\n      border: none;\n      color: white;\n      font-size: 22px;\n      font-weight: bold;\n      cursor: pointer;\n      box-shadow: 0 4px 16px rgba(0,0,0,0.6);\n      z-index: 2147483647 !important;  /* max int \u2014 zawsze na wierzchu */\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      transition: transform 0.15s, opacity 0.15s;\n      user-select: none;\n      -webkit-tap-highlight-color: transparent;\n      touch-action: manipulation;\n      pointer-events: auto !important;\n    }\n    .fab:active { transform: scale(0.9); }\n    .fab-red    { background: linear-gradient(135deg, #ff4466 0%, #cc1144 100%); right: 16px; bottom: 80px; }\n    .fab-yellow { background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%); color: #333; right: 16px; bottom: 150px; }\n    .fab-exit   { background: linear-gradient(135deg, #ff4466 0%, #cc1144 100%); left: 16px; top: 16px; width: 44px; height: 44px; font-size: 18px; display: none; }\n    body.fullscreen-mode .fab-exit { display: flex; }\n    body.fullscreen-mode .fab-red    { bottom: 24px; }\n    body.fullscreen-mode .fab-yellow { bottom: 90px; }\n\n    /* D-pad panel (niebieski) */\n    .dpad-panel {\n      position: fixed !important;\n      right: 16px; bottom: 150px;\n      background: linear-gradient(135deg, rgba(0, 100, 220, 0.97) 0%, rgba(0, 60, 180, 0.97) 100%);\n      border: 2px solid rgba(0, 200, 255, 0.6);\n      border-radius: 16px;\n      padding: 14px;\n      box-shadow: 0 8px 32px rgba(0,0,0,0.7);\n      z-index: 2147483647 !important;\n      display: none;\n      width: 200px;\n      pointer-events: auto !important;\n    }\n    .dpad-panel.open { display: block; }\n    body.fullscreen-mode .dpad-panel.open { width: 220px; bottom: 90px; }\n    .dpad-grid {\n      display: grid;\n      grid-template-columns: repeat(3, 1fr);\n      grid-template-rows: repeat(3, 1fr);\n      gap: 6px;\n      margin-bottom: 8px;\n    }\n    .dpad-btn {\n      width: 56px; height: 56px;\n      border: none;\n      border-radius: 10px;\n      background: rgba(255,255,255,0.18);\n      color: white;\n      font-size: 24px;\n      font-weight: bold;\n      cursor: pointer;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      transition: background 0.1s;\n      user-select: none;\n      -webkit-tap-highlight-color: transparent;\n      touch-action: manipulation;\n    }\n    .dpad-btn:active { background: rgba(255,255,255,0.45); }\n    .dpad-empty { visibility: hidden; }\n    .dpad-up    { grid-column: 2; grid-row: 1; }\n    .dpad-left  { grid-column: 1; grid-row: 2; }\n    .dpad-enter { grid-column: 2; grid-row: 2; background: rgba(0, 255, 170, 0.4); font-size: 14px; }\n    .dpad-right { grid-column: 3; grid-row: 2; }\n    .dpad-down  { grid-column: 2; grid-row: 3; }\n    .dpad-close-row { display: flex; justify-content: flex-end; }\n    .dpad-close {\n      width: 36px; height: 36px;\n      border: none;\n      border-radius: 8px;\n      background: rgba(255, 68, 102, 0.6);\n      color: white;\n      font-size: 18px;\n      cursor: pointer;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n    }\n    .dpad-close:active { background: rgba(255, 68, 102, 0.9); }\n\n    /* Dodatkowe przyciski w D-pad panelu (Ctrl+Alt+Del, fullscreen, stop, close) */\n    .dpad-extras {\n      display: grid;\n      grid-template-columns: repeat(4, 1fr);\n      gap: 6px;\n      padding-top: 8px;\n      border-top: 1px solid rgba(255,255,255,0.2);\n    }\n    .dpad-extra-btn {\n      height: 40px;\n      border: none;\n      border-radius: 8px;\n      background: rgba(255,255,255,0.18);\n      color: white;\n      font-size: 18px;\n      cursor: pointer;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      user-select: none;\n      -webkit-tap-highlight-color: transparent;\n      touch-action: manipulation;\n    }\n    .dpad-extra-btn:active { background: rgba(255,255,255,0.4); }\n    .dpad-close { width: 100%; height: 40px; background: rgba(255, 68, 102, 0.6); font-size: 16px; }\n    .dpad-close:active { background: rgba(255, 68, 102, 0.9); }\n\n    /* W landscape mode D-pad po lewej, FAB-y po prawej \u2014 omijamy \u015brodek ekranu VM */\n    @media (orientation: landscape) and (max-height: 500px) {\n      .fab-red    { right: 8px; bottom: 8px; width: 48px; height: 48px; font-size: 18px; }\n      .fab-yellow { right: 8px; bottom: 64px; width: 48px; height: 48px; font-size: 18px; }\n      .dpad-panel { right: 8px; bottom: 64px; width: 180px; padding: 10px; }\n      .dpad-btn { width: 48px; height: 48px; font-size: 20px; }\n    }\n\n    /* Na desktopie (>1024px szeroko\u015bci) chowaj FAB-y \u2014 tam jest prawdziwa klawiatura */\n    @media (min-width: 1024px) and (hover: hover) and (pointer: fine) {\n      .fab, .dpad-panel { display: none !important; }\n    }\n\n    /* Na mobile chowamy 3 przyciski toolbar \u2014 sa niepotrzebne bo FAB-y za\u0142atwiaj\u0105 sprawe */\n    @media (max-width: 1023px) {\n      #ctrl-alt-del, #fullscreen, #stop-vm { display: none !important; }\n      .toolbar { gap: 0; min-height: 0; margin: 0; padding: 0; }\n    }\n\n    /* ===== Sekcja Opcjonalne ===== */\n    .optional-card { grid-column: span 1; }\n    .checkbox-row {\n      display: flex;\n      align-items: center;\n      gap: 10px;\n      padding: 10px 0;\n      cursor: pointer;\n      user-select: none;\n    }\n    .checkbox-row input[type=\"checkbox\"] {\n      width: 20px;\n      height: 20px;\n      cursor: pointer;\n      accent-color: #00ffaa;\n      flex-shrink: 0;\n    }\n    .checkbox-row span {\n      font-size: 0.85rem;\n      color: #c8d4e8;\n      line-height: 1.3;\n    }\n    .checkbox-row span small {\n      display: block;\n      color: #6b7a99;\n      font-size: 0.7rem;\n      margin-top: 2px;\n    }\n\n    /* Skalowanie obrazu VM \u2014 gdy w\u0142\u0105czone, canvas wype\u0142nia ca\u0142\u0105 szeroko\u015b\u0107 kontenera */\n    #screen_container.auto-scale > canvas {\n      width: 100% !important;\n      height: auto !important;\n      max-height: 70vh;\n      object-fit: contain;\n      image-rendering: pixelated;\n      image-rendering: crisp-edges;\n    }\n    #screen_wrapper:-webkit-full-screen #screen_container.auto-scale > canvas,\n    #screen_wrapper:-moz-full-screen #screen_container.auto-scale > canvas,\n    #screen_wrapper:fullscreen #screen_container.auto-scale > canvas {\n      width: 100vw !important;\n      height: 100vh !important;\n      max-height: 100vh;\n      object-fit: contain;\n    }\n\n    /* Ukryty input do wywo\u0142ywania systemowej klawiatury \u2014 musi by\u0107 wewn\u0105trz #screen_wrapper \u017ceby dzia\u0142a\u0142 w fullscreen */\n    #hidden-keyboard-input {\n      position: absolute;\n      left: 50%;\n      top: 50%;\n      transform: translate(-50%, -50%);\n      width: 1px;\n      height: 1px;\n      opacity: 0.01;\n      border: none;\n      background: transparent;\n      color: transparent;\n      font-size: 16px;\n      caret-color: transparent;\n      z-index: 1;\n      pointer-events: none;\n    }\n    #hidden-keyboard-input.focused {\n      pointer-events: auto;\n      opacity: 0;\n    }\n  <\/style>\n<\/head>\n<body>\n  <header>\n    <h1>SKJemu<\/h1>\n    <div class=\"subtitle\">WASM \u00b7 HTML5 \u00b7 Browser VM<\/div>\n  <\/header>\n\n  <div class=\"controls\">\n    <div class=\"control-card\">\n      <span class=\"step-badge\">1<\/span>\n      <label>ISO<\/label>\n      <input type=\"file\" id=\"iso-input\" accept=\".iso,application/octet-stream,image/iso\" style=\"display:none\">\n      <button class=\"btn\" id=\"iso-btn\">Wybierz ISO<\/button>\n      <button class=\"btn-secondary\" id=\"tinycore-btn\">\u2b07 Pobierz TinyCore<\/button>\n      <div class=\"file-name\" id=\"iso-name\">Brak pliku<\/div>\n    <\/div>\n\n    <div class=\"control-card\">\n      <span class=\"step-badge\">2<\/span>\n      <label>RAM<\/label>\n      <input type=\"range\" id=\"ram-slider\" min=\"1\" max=\"6\" step=\"1\" value=\"2\">\n      <div class=\"ram-display\">\n        <span class=\"ram-value\" id=\"ram-display\">2<\/span><span class=\"ram-unit\">GB<\/span>\n      <\/div>\n      <div class=\"ram-ticks\">\n        <span>1<\/span><span>2<\/span><span>3<\/span><span>4<\/span><span>5<\/span><span>6<\/span>\n      <\/div>\n      <button class=\"btn-secondary\" id=\"ram-create-btn\">\ud83d\udcc4 Utw\u00f3rz plik RAM<\/button>\n      <button class=\"btn-secondary\" id=\"ram-load-btn\">\ud83d\udcc2 Wczytaj plik RAM<\/button>\n      <div class=\"disk-info\" id=\"ram-info\">RAM z suwaka (2 GB)<\/div>\n    <\/div>\n\n    <div class=\"control-card\">\n      <span class=\"step-badge\">3<\/span>\n      <label>BIOS<\/label>\n      <button class=\"btn\" id=\"bios-btn\">\u2b07 Pobierz SeaBIOS<\/button>\n      <button class=\"btn-secondary\" id=\"bios-load-btn\">\ud83d\udcc2 Wybierz BIOS<\/button>\n      <div class=\"file-name\" id=\"bios-name\">Domy\u015blny (z CDN)<\/div>\n    <\/div>\n\n    <div class=\"control-card optional-card\">\n      <span class=\"step-badge\">\u2699<\/span>\n      <label>Opcjonalne<\/label>\n      <label class=\"checkbox-row\">\n        <input type=\"checkbox\" id=\"opt-network\">\n        <span>\n          Dost\u0119p do Internetu\n          <small>Wirtualna karta sieciowa (NE2000) \u2014 pozwala VM na sie\u0107 przez relay v86<\/small>\n        <\/span>\n      <\/label>\n      <label class=\"checkbox-row\">\n        <input type=\"checkbox\" id=\"opt-autoscale\" checked>\n        <span>\n          Automatyczne skalowanie obrazu\n          <small>Canvas VM wype\u0142nia ca\u0142\u0105 szeroko\u015b\u0107 ekranu (zachowuj\u0105c proporcje)<\/small>\n        <\/span>\n      <\/label>\n    <\/div>\n\n    <div class=\"control-card\">\n      <span class=\"step-badge\">4<\/span>\n      <label>Run VM<\/label>\n      <button class=\"btn btn-run\" id=\"run-btn\">Uruchom VM<\/button>\n      <button class=\"btn-secondary\" id=\"hdd-create-btn\">\ud83d\
