     ══════════════════ JAK EDYTOWAĆ TĘ STRONĘ ══════════════════

     Wszystko, co kiedykolwiek zmieniasz, jest w sekcji EDYTUJ TUTAJ
     zaraz poniżej. Reszta pliku to kod strony i nie trzeba go ruszać.

     DODANIE PROJEKTU
       1. Znajdź  const PROJECTS = [ ... ]
       2. Skopiuj cały blok { ... } razem z przecinkiem po }
       3. Wklej go wewnątrz [ ] i uzupełnij pola:

          name    tytuł karty
          desc    jedna krótka linijka: co to robi
          url     działający link, np. "https://cos.skj-tech.online"
                  zostaw "" aby ukryć przycisk Otwórz
          repo    link do GitHuba · "" ukrywa przycisk Kod
          tags    ["html","gra"] małe znaczniki na karcie · [] = brak
          status  "live" (zielony) · "wip" (żółty) · "paused" (szary)

       Zasady: nie usuwaj cudzysłowów ani przecinków. Każdy blok
       { ... } kończy się przecinkiem. Tekst z cudzysłowem w środku?
       Użyj ' zamiast ".

     KOLEJNOŚĆ   przesuwaj całe bloki { ... } w górę lub w dół.
                 Kolejność na liście = kolejność na stronie.
     USUWANIE    skasuj cały blok { ... } (razem z przecinkiem).
     UKRYWANIE   otocz blok znakami /* i */ aby ukryć bez kasowania.
     DANE STRONY w  const SITE = { ... } : tagline, przycisk GitHub,
                 dodatkowe przyciski w nagłówku (links).

     PUBLIKACJA
       Zapisz plik i wgraj go na Cloudflare tak samo jak inne wasze
       aplikacje (projekt Pages → nowy deployment). Przed wgraniem
       możesz po prostu otworzyć plik na telefonie lub PC, żeby
       zobaczyć podgląd. Działa w pełni offline, bez bibliotek
       i bez internetu.

     SEO (Google / Bing)
       Tytuł strony (title) i meta opis (description) są wpisane na
       sztywno w sekcji head na samej górze pliku. Wyszukiwarki chcą
       dłuższych tekstów, więc nie skracaj ich. Nagłówkiem h1 jest
       nazwa w lewym górnym rogu strony.

     JEŚLI STRONA POKAZUJE CZERWONY BŁĄD
       Sekcja z danymi ma błąd składni. Prawie zawsze to brakujący
       przecinek lub cudzysłów obok ostatniej edycji. Popraw, odśwież.
     ═══════════════════════════════════════════════════════════════════ -->

<style>
  :root{
    --bg:#0c0e11; --panel:#12151a; --line:#242a32; --line-hi:#3a4350;
    --text:#e7ecf2; --muted:#8e99a8;
    --live:#4ac26b; --wip:#d4a72c; --paused:#768390; --danger:#e5534b;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--text);
    font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none}
  .wrap{max-width:1080px; margin:0 auto; padding:44px 20px 56px}

  .top{display:flex; justify-content:space-between; align-items:flex-start; gap:18px; flex-wrap:wrap}
  .brand{
    margin:0; font-family:var(--mono); font-weight:600;
    font-size:clamp(26px,6vw,40px); letter-spacing:-.03em; line-height:1.1;
  }
  .dim{color:var(--muted); font-weight:400}
  .brand .cursor{
    display:inline-block; width:.55ch; height:1em;
    background:var(--text); margin-left:.15ch; vertical-align:text-bottom;
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){ .brand .cursor{animation:none} }
  .tagline{color:var(--muted); margin:10px 0 0; max-width:60ch}
  .nav{display:flex; gap:8px; flex-wrap:wrap}

  .btn{
    display:inline-flex; align-items:center; gap:6px;
    padding:7px 14px; border:1px solid var(--line); border-radius:8px;
    font-family:var(--mono); font-size:13.5px; color:var(--text);
    transition:border-color .15s, background .15s;
  }
  .btn:hover{border-color:var(--line-hi); background:var(--panel)}
  .btn:focus-visible, a:focus-visible{outline:2px solid var(--line-hi); outline-offset:2px}

  .sec{
    margin:48px 0 14px; color:var(--muted);
    font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase;
  }

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px}
  .card{
    border:1px solid var(--line); background:var(--panel); border-radius:12px;
    padding:18px; display:flex; flex-direction:column; gap:10px;
    transition:border-color .15s;
  }
  .card:hover{border-color:var(--line-hi)}
  .chead{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
  .card h2{margin:0; font-size:17px; font-weight:600}
  .status{
    font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted); display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .status i{width:7px; height:7px; border-radius:50%; display:inline-block}
  .desc{margin:0; color:var(--muted); font-size:14px; flex:1}
  .tags{display:flex; flex-wrap:wrap; gap:6px}
  .tag{
    font-family:var(--mono); font-size:11px; color:var(--muted);
    border:1px solid var(--line); border-radius:999px; padding:2px 9px;
  }
  .actions{display:flex; gap:8px; margin-top:2px}
  .actions .btn{padding:6px 12px; font-size:13px}

  .empty{
    border:1px dashed var(--line); border-radius:12px;
    padding:34px 20px; text-align:center; color:var(--muted); font-size:14.5px;
  }
  .empty.error{border-color:var(--danger); color:var(--danger); border-style:solid}

  footer{
    margin-top:60px; padding-top:18px; border-top:1px solid var(--line);
    color:var(--muted); font-family:var(--mono); font-size:12.5px;
    display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
</style>

<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="brand" class="brand"></h1>
      <p id="tagline" class="tagline"></p>
    </div>
    <nav id="nav" class="nav"></nav>
  </header>

  <div id="count" class="sec"></div>
  <div id="grid" class="grid"></div>

  <footer>
    <span id="fleft"></span>
    <span id="fright" class="dim"></span>
  </footer>
</div>

<noscript><p style="padding:20px;font-family:monospace">Włącz JavaScript, aby zobaczyć listę projektów.</p></noscript>
<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };
  function el(t, c, x){
    var e = document.createElement(t);
    if (c) e.className = c;
    if (x != null) e.textContent = x;
    return e;
  }
  function link(label, href){
    var a = el("a", "btn", label);
    a.href = href; a.target = "_blank"; a.rel = "noopener";
    return a;
  }

  if (typeof SITE === "undefined" || typeof PROJECTS === "undefined"){
    $("#grid").append(el("div", "empty error",
      "Sekcja EDYTUJ TUTAJ na górze tego pliku ma błąd składni — " +
      "prawie zawsze to brakujący przecinek lub cudzysłów obok " +
      "ostatniej edycji. Otwórz plik, popraw, odśwież."));
    return;
  }

  var STATUS = {
    live:   ["Działa",    "var(--live)"],
    wip:    ["W budowie", "var(--wip)"],
    paused: ["Pauza",     "var(--paused)"]
  };

  var b = $("#brand");
  b.append(el("span", null, SITE.wordmark || ""),
           el("span", "dim", SITE.wordmarkSuffix || ""),
           el("span", "cursor"));
  $("#tagline").textContent = SITE.tagline || "";

  var nav = $("#nav");
  if (SITE.github) nav.append(link("GitHub", SITE.github));
  (SITE.links || []).forEach(function(l){
    if (l && l.url) nav.append(link(l.label || l.url, l.url));
  });

  var ps = PROJECTS || [];
  $("#count").textContent = "Projekty — " + ps.length;

  var g = $("#grid");
  if (!ps.length){
    g.append(el("div", "empty", "Brak projektów — dodaj pierwszy w sekcji EDYTUJ TUTAJ."));
  }
  ps.forEach(function(p){
    var c = el("article", "card");

    var head = el("div", "chead");
    head.append(el("h2", null, p.name || "Bez nazwy"));
    var st = STATUS[p.status] || [p.status || "—", "var(--paused)"];
    var s = el("span", "status");
    var dot = el("i"); dot.style.background = st[1];
    s.append(dot, document.createTextNode(st[0]));
    head.append(s);
    c.append(head);

    if (p.desc) c.append(el("p", "desc", p.desc));

    if (p.tags && p.tags.length){
      var t = el("div", "tags");
      p.tags.forEach(function(x){ t.append(el("span", "tag", x)); });
      c.append(t);
    }

    var act = el("div", "actions");
    if (p.url)  act.append(link("Otwórz ↗", p.url));
    if (p.repo) act.append(link("Kod", p.repo));
    if (act.children.length) c.append(act);

    g.append(c);
  });

  $("#fleft").textContent = "© " + new Date().getFullYear() + " " + (SITE.name || "");
  $("#fright").textContent = (SITE.wordmark || "") + (SITE.wordmarkSuffix || "");
})();
</script>
</body>
