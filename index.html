<!doctype html>
<!-- ═══════════════════════════════════════════════════════════════════
     SKJ TECH  ·  skj-tech.online  ·  main page (single file)

     PL: Wszystko edytujesz w sekcji "EDIT HERE" zaraz poniżej.
         Dodaj projekt → zapisz plik → wgraj na Cloudflare. Tyle.

     ══════════════════ HOW TO EDIT THIS PAGE ══════════════════

     Everything you ever change lives in the EDIT HERE block just
     below. The rest of the file is page code and never needs touching.

     ADD A PROJECT
       1. Find  const PROJECTS = [ ... ]
       2. Copy one whole { ... } block, including the comma after }
       3. Paste it inside the [ ], fill in the fields:

          name    card title
          desc    one short line about what it does
          url     live link, e.g. "https://blockflow.skj-tech.online"
                  leave as "" to hide the Open button
          repo    GitHub link · "" hides the Code button
          tags    ["html","game"] small pills on the card · [] for none
          status  "live" (green) · "wip" (yellow) · "paused" (gray)

       Rules: keep the quotes, keep the commas. Every { ... } block
       ends with a comma. Text with a quote in it? Use ' instead: "Ja's app"

     REORDER    move whole { ... } blocks up or down.
                Order in the list = order on the page.
     REMOVE     delete the whole { ... } block (with its comma).
     HIDE       wrap a block in /* and */ to hide it without deleting.
     SITE INFO  in  const SITE = { ... } : tagline, GitHub button,
                extra header buttons (links).

     PUBLISH
       Save, then upload this file to Cloudflare the same way as your
       other apps (your Pages project → new deployment). Before
       uploading you can just open the file on your phone or PC to
       preview it. It works fully offline, no libraries, no internet.

     IF THE PAGE SHOWS A RED ERROR BOX
       The data block has a syntax error. It is almost always a
       missing comma or quote near your last edit. Fix it, refresh.
     ═══════════════════════════════════════════════════════════════════ -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0c0e11">
<meta name="description" content="SKJ Tech — projects by Kuba &amp; Jaś">
<title>SKJ Tech</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%230c0e11'/%3E%3Ctext%20x='32'%20y='42'%20font-family='monospace'%20font-size='22'%20fill='%23e7ecf2'%20text-anchor='middle'%3ESKJ%3C/text%3E%3C/svg%3E">

<script>
/* ╔════════════════════════════════════════════════╗
   ║   ✏️  EDIT HERE — the only part you change  ✏️   ║
   ╚════════════════════════════════════════════════╝ */

const SITE = {
  name: "SKJ Tech",
  wordmark: "skj-tech",          // big header text
  wordmarkSuffix: ".online",     // dimmed part right after it
  tagline: "Sklep Kuby i Jasia",
  github: "https://github.com/SKJ-Technology",   // main GitHub button · "" hides it
  links: [
    // Extra header buttons — remove the // at the start of a line to enable:
     { label: "Kuba", url: "https://github.com/jakub362" },
     { label: "Jaś",  url: "https://github.com/Janolo2456" },
  ],
};

const PROJECTS = [

  {
    name: "SKJ Search",                        // ← card title
    desc: "A search engine created by SKJ.", // ← one-line description
    url: "https://search.skj-tech.online",         // ← Open button · "" hides it
    repo: "",                                       // ← Code button · "" hides it
    tags: ["html", "Search Engine"],                      // ← small pills · [] for none
    status: "live",                                  // ← "live" | "wip" | "paused"
  },
 {
    name: "SKJ Apps",                        // ← card title
    desc: "Apps made by Jan of SKJ.", // ← one-line description
    url: "https://apps.skj-tech.online",         // ← Open button · "" hides it
    repo: "",                                       // ← Code button · "" hides it
    tags: ["html", "Apps"],                      // ← small pills · [] for none
    status: "live",                                  // ← "live" | "wip" | "paused"
  },
];

/* ────────────────  END OF EDIT AREA  ────────────────
   Everything below is page code. You never need to
   change anything under this line.
   ───────────────────────────────────────────────────── */
</script>

<style>
  :root{
    --bg:#0c0e11; --panel:#12151a; --line:#242a32; --line-hi:#3a4350;
    --text:#e7ecf2; --muted:#8e99a8;
    --live:#4ac26b; --wip:#d4a72c; --paused:#768390; --danger:#e5534b;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--text);
    font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none}
  .wrap{max-width:1080px; margin:0 auto; padding:44px 20px 56px}

  .top{display:flex; justify-content:space-between; align-items:flex-start; gap:18px; flex-wrap:wrap}
  .brand{
    font-family:var(--mono); font-weight:600;
    font-size:clamp(26px,6vw,40px); letter-spacing:-.03em; line-height:1.1;
  }
  .dim{color:var(--muted); font-weight:400}
  .brand .cursor{
    display:inline-block; width:.55ch; height:1em;
    background:var(--text); margin-left:.15ch; vertical-align:text-bottom;
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){ .brand .cursor{animation:none} }
  .tagline{color:var(--muted); margin:10px 0 0; max-width:60ch}
  .nav{display:flex; gap:8px; flex-wrap:wrap}

  .btn{
    display:inline-flex; align-items:center; gap:6px;
    padding:7px 14px; border:1px solid var(--line); border-radius:8px;
    font-family:var(--mono); font-size:13.5px; color:var(--text);
    transition:border-color .15s, background .15s;
  }
  .btn:hover{border-color:var(--line-hi); background:var(--panel)}
  .btn:focus-visible, a:focus-visible{outline:2px solid var(--line-hi); outline-offset:2px}

  .sec{
    margin:48px 0 14px; color:var(--muted);
    font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase;
  }

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px}
  .card{
    border:1px solid var(--line); background:var(--panel); border-radius:12px;
    padding:18px; display:flex; flex-direction:column; gap:10px;
    transition:border-color .15s;
  }
  .card:hover{border-color:var(--line-hi)}
  .chead{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
  .card h3{margin:0; font-size:17px; font-weight:600}
  .status{
    font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted); display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .status i{width:7px; height:7px; border-radius:50%; display:inline-block}
  .desc{margin:0; color:var(--muted); font-size:14px; flex:1}
  .tags{display:flex; flex-wrap:wrap; gap:6px}
  .tag{
    font-family:var(--mono); font-size:11px; color:var(--muted);
    border:1px solid var(--line); border-radius:999px; padding:2px 9px;
  }
  .actions{display:flex; gap:8px; margin-top:2px}
  .actions .btn{padding:6px 12px; font-size:13px}

  .empty{
    border:1px dashed var(--line); border-radius:12px;
    padding:34px 20px; text-align:center; color:var(--muted); font-size:14.5px;
  }
  .empty.error{border-color:var(--danger); color:var(--danger); border-style:solid}

  footer{
    margin-top:60px; padding-top:18px; border-top:1px solid var(--line);
    color:var(--muted); font-family:var(--mono); font-size:12.5px;
    display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div id="brand" class="brand"></div>
      <p id="tagline" class="tagline"></p>
    </div>
    <nav id="nav" class="nav"></nav>
  </header>

  <div id="count" class="sec"></div>
  <div id="grid" class="grid"></div>

  <footer>
    <span id="fleft"></span>
    <span id="fright" class="dim"></span>
  </footer>
</div>

<noscript><p style="padding:20px;font-family:monospace">Enable JavaScript to see the project list.</p></noscript>
<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };
  function el(t, c, x){
    var e = document.createElement(t);
    if (c) e.className = c;
    if (x != null) e.textContent = x;
    return e;
  }
  function link(label, href){
    var a = el("a", "btn", label);
    a.href = href; a.target = "_blank"; a.rel = "noopener";
    return a;
  }

  if (typeof SITE === "undefined" || typeof PROJECTS === "undefined"){
    $("#grid").append(el("div", "empty error",
      "The EDIT HERE block at the top of this file has a syntax error — " +
      "almost always a missing comma or quote near your last edit. " +
      "Open the file, fix it, refresh."));
    return;
  }

  var STATUS = {
    live:   ["Live",   "var(--live)"],
    wip:    ["WIP",    "var(--wip)"],
    paused: ["Paused", "var(--paused)"]
  };

  document.title = SITE.name || "SKJ Tech";

  var b = $("#brand");
  b.append(el("span", null, SITE.wordmark || ""),
           el("span", "dim", SITE.wordmarkSuffix || ""),
           el("span", "cursor"));
  $("#tagline").textContent = SITE.tagline || "";

  var nav = $("#nav");
  if (SITE.github) nav.append(link("GitHub", SITE.github));
  (SITE.links || []).forEach(function(l){
    if (l && l.url) nav.append(link(l.label || l.url, l.url));
  });

  var ps = PROJECTS || [];
  $("#count").textContent = "Projects — " + ps.length;

  var g = $("#grid");
  if (!ps.length){
    g.append(el("div", "empty", "No projects yet — add one in the EDIT HERE block."));
  }
  ps.forEach(function(p){
    var c = el("article", "card");

    var head = el("div", "chead");
    head.append(el("h3", null, p.name || "Untitled"));
    var st = STATUS[p.status] || [p.status || "—", "var(--paused)"];
    var s = el("span", "status");
    var dot = el("i"); dot.style.background = st[1];
    s.append(dot, document.createTextNode(st[0]));
    head.append(s);
    c.append(head);

    if (p.desc) c.append(el("p", "desc", p.desc));

    if (p.tags && p.tags.length){
      var t = el("div", "tags");
      p.tags.forEach(function(x){ t.append(el("span", "tag", x)); });
      c.append(t);
    }

    var act = el("div", "actions");
    if (p.url)  act.append(link("Open ↗", p.url));
    if (p.repo) act.append(link("Code", p.repo));
    if (act.children.length) c.append(act);

    g.append(c);
  });

  $("#fleft").textContent = "© " + new Date().getFullYear() + " " + (SITE.name || "");
  $("#fright").textContent = (SITE.wordmark || "") + (SITE.wordmarkSuffix || "");
})();
</script>
</body>
</html>
