<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKJ-Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }
        
        .nav-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .nav-btn {
            flex: 1;
            display: block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .search-wrapper {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SKJ Search</h1>
        <div class="nav-buttons">
            <a href="https://skj-tech.online/apps/" class="nav-btn" target="_blank" rel="noopener noreferrer">Apps</a>
            <a href="https://skj-tech.online" class="nav-btn" target="_blank" rel="noopener noreferrer">Home</a>
        </div>
        <div class="search-wrapper">
            <script async src="https://cse.google.com/cse.js?cx=d7921f537e2154693"></script>
            <div class="gcse-search"></div>
        </div>
    </div>
</body>
</html>
